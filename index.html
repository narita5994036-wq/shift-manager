// ── Helpers ──────────────────────────────────────────────────
function dateKey(y, m, d) {
  return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}
function calcHours(start, end, breakMin = 60) {
  if (!start || !end) return null;
  const [sh, sm] = start.split(":").map(Number);
  const [eh, em] = end.split(":").map(Number);
  const diff = (eh * 60 + em) - (sh * 60 + sm) - breakMin;
  return diff > 0 ? diff / 60 : null;
}
function defaultEndTime(start) {
  if (!start) return "";
  const [h, m] = start.split(":").map(Number);
  const total = h * 60 + m + 9 * 60; // 9時間後
  return `${String(Math.floor(total / 60) % 24).padStart(2,"0")}:${String(total % 60).padStart(2,"0")}`;
}
function formatHours(h) {
  const hours = Math.floor(h);
  const mins = Math.round((h - hours) * 60);
  return mins > 0 ? `${hours}h ${mins}m` : `${hours}h`;
}

// ── ICS Export ───────────────────────────────────────────────
function generateICS(shifts, memberName, year, month) {
  const pad = n => String(n).padStart(2, "0");
  // JST→UTC: subtract 9 hours
  function toUTC(dateStr, timeStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    const [h, min] = timeStr.split(":").map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d, h - 9, min, 0));
    return `${dt.getUTCFullYear()}${pad(dt.getUTCMonth()+1)}${pad(dt.getUTCDate())}T${pad(dt.getUTCHours())}${pad(dt.getUTCMinutes())}00Z`;
  }
  const lines = [
    "BEGIN:VCALENDAR", "VERSION:2.0",
    "PRODID:-//ShiftManager//JP", "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
  ];
  Object.entries(shifts).sort().forEach(([dateStr, shift]) => {
    if (!shift || shift.status === "休日" || !shift.startTime) return;
    const dtStart = toUTC(dateStr, shift.startTime);
    const endT = shift.endTime || shift.startTime;
    const dtEnd = toUTC(dateStr, endT);
    const summary = `${memberName} 出勤 ${shift.startTime}${shift.endTime ? "–" + shift.endTime : ""}`;
    lines.push("BEGIN:VEVENT");
    lines.push(`DTSTART:${dtStart}`);
    lines.push(`DTEND:${dtEnd}`);
    lines.push(`SUMMARY:${summary}`);
    if (shift.memo) lines.push(`DESCRIPTION:${shift.memo.replace(/\n/g, "\\n")}`);
    lines.push(`UID:${memberName}-${dateStr}@shift-manager`);
    lines.push("END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  return lines.join("\r\n");
}
function downloadICS(shifts, memberName, year, month) {
  const content = generateICS(shifts, memberName, year, month);
  const blob = new Blob([content], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `shift-${memberName}-${year}-${String(month).padStart(2,"0")}.ics`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ── Counter View ──────────────────────────────────────────────
function CounterView({ member, year, month, shifts, saveShifts }) {
  const todayStr = (() => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  })();
  const todayLabel = (() => {
    const d = new Date();
    const days = ["日","月","火","水","木","金","土"];
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")} ${days[d.getDay()]}`;
  })();
  const storageKey = `counter:${todayStr}`;

  const loadData = () => {
    try {
      const raw = storage.get(storageKey);
      if (raw) {
        const d = JSON.parse(raw);
        // migrate old numeric format
        if (typeof d.prospects === "number") d.prospects = [];
        if (typeof d.repairs   === "number") d.repairs   = [];
        return d;
      }
    } catch(e) {}
    return { visitors: 0, prospects: [], repairs: [], purchases: [] };
  };

  const [data, setData] = useState(loadData);
  const [flashVisitor, setFlashVisitor] = useState(false);
  const [staffPicker, setStaffPicker] = useState(null); // null | "prospects" | "repairs" | "purchases"
  const [confirmReset, setConfirmReset] = useState(false);

  function persist(next) {
    setData(next);
    try { storage.set(storageKey, JSON.stringify(next)); } catch(e) {}
  }

  function incVisitor() {
    persist({ ...data, visitors: data.visitors + 1 });
    setFlashVisitor(true);
    setTimeout(() => setFlashVisitor(false), 120);
  }
  function undoVisitor() { if (data.visitors > 0) persist({ ...data, visitors: data.visitors - 1 }); }

  function addEntry(category, staff) {
    const now = new Date();
    const time = `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
    persist({ ...data, [category]: [...data[category], { staff, time }] });
    setStaffPicker(null);
  }
  function removeEntry(category, i) {
    persist({ ...data, [category]: data[category].filter((_, idx) => idx !== i) });
  }

  function staffSummary(entries) {
    return MEMBERS.map(m => {
      const n = entries.filter(e => e.staff === m).length;
      return n > 0 ? `${m}${n}` : null;
    }).filter(Boolean).join("・");
  }

  function buildMemoLine() {
    const pCount  = data.purchases.length;
    const prCount = data.prospects.length;
    const rCount  = data.repairs.length;
    const total   = data.visitors + prCount + rCount;
    const parts = [];
    if (total    > 0) parts.push(`来店${total}`);
    if (prCount  > 0) { const s = staffSummary(data.prospects); parts.push(`見込${prCount}${s ? `(${s})` : ""}`); }
    if (rCount   > 0) { const s = staffSummary(data.repairs);   parts.push(`修理${rCount}${s ? `(${s})` : ""}`); }
    if (pCount   > 0) { const s = staffSummary(data.purchases); parts.push(`購入${pCount}${s ? `(${s})` : ""}`); }
    return parts.join(" / ");
  }

  function reset() {
    const memo = buildMemoLine();
    if (memo && shifts && saveShifts) {
      const existing = shifts[todayStr];
      if (existing) {
        const prev = existing.memo ? existing.memo.trim() : "";
        saveShifts({ ...shifts, [todayStr]: { ...existing, memo: prev ? `${prev}\n${memo}` : memo } });
      }
    }
    persist({ visitors: 0, prospects: [], repairs: [], purchases: [] });
    setConfirmReset(false);
  }

  const totalVisitors = data.visitors + data.prospects.length + data.repairs.length;

  function EntryList({ category, label }) {
    const entries = data[category];
    const counts  = MEMBERS.reduce((acc, m) => { acc[m] = entries.filter(e => e.staff === m).length; return acc; }, {});
    return (
      <div style={{ background: "#fff", border: "1px solid #e0dedd", padding: "16px 14px", marginBottom: 10 }}>
        <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 10 }}>
          <div>
            <div style={{ fontSize: 9, letterSpacing: 2, color: "#bbb", marginBottom: 6 }}>{label}</div>
            <div style={{ fontSize: 40, fontWeight: 200, letterSpacing: -1 }}>{entries.length}</div>
          </div>
          <button
            onClick={() => setStaffPicker(category)}
            style={{ padding: "10px 18px", background: "#111", border: "none", cursor: "pointer", color: "#fff", fontSize: 18, lineHeight: 1, marginTop: 4 }}
          >＋</button>
        </div>
        {entries.length > 0 && (
          <>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 8 }}>
              {MEMBERS.filter(m => counts[m] > 0).map(m => (
                <div key={m} style={{ fontSize: 10, color: "#555", background: "#f5f4f2", padding: "3px 10px" }}>{m} {counts[m]}</div>
              ))}
            </div>
            {entries.map((e, i) => (
              <div key={i} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "6px 0", borderTop: "1px solid #f0eeec" }}>
                <div style={{ fontSize: 12, color: "#444" }}>{e.staff}</div>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <div style={{ fontSize: 10, color: "#aaa", letterSpacing: 1 }}>{e.time}</div>
                  <button onClick={() => removeEntry(category, i)} style={{ background: "none", border: "none", cursor: "pointer", color: "#ccc", padding: 2, lineHeight: 1, fontSize: 14 }}>×</button>
                </div>
              </div>
            ))}
          </>
        )}
      </div>
    );
  }

  return (
    <div style={{ padding: "24px 16px 60px" }}>
      <div style={{ fontSize: 10, letterSpacing: 3, color: "#bbb", textTransform: "uppercase", marginBottom: 24, textAlign: "center" }}>{todayLabel}</div>

      {/* ── 来店合計 (big) ──────────────────────────── */}
      <div style={{ display: "flex", alignItems: "center", gap: 20, marginBottom: 20, padding: "20px 20px", background: "#fff", border: "1px solid #e0dedd" }}>
        <button
          onClick={incVisitor}
          style={{
            width: 80, height: 80, borderRadius: "50%", flexShrink: 0,
            background: flashVisitor ? "#333" : "#111",
            border: "none", cursor: "pointer", color: "#fff",
            transition: "background 0.1s", WebkitTapHighlightColor: "transparent",
            display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 4
          }}
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <span style={{ fontSize: 8, letterSpacing: 2 }}>来店</span>
        </button>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 56, fontWeight: 200, letterSpacing: -2, lineHeight: 1, color: flashVisitor ? "#555" : "#111", transition: "color 0.1s" }}>{totalVisitors}</div>
          <div style={{ fontSize: 9, letterSpacing: 2, color: "#bbb", marginTop: 4 }}>
            TOTAL
            {(data.prospects.length > 0 || data.repairs.length > 0) && (
              <span style={{ marginLeft: 8, color: "#ccc" }}>
                ({data.visitors}直接 {data.prospects.length > 0 ? `+見込${data.prospects.length} ` : ""}{data.repairs.length > 0 ? `+修理${data.repairs.length}` : ""})
              </span>
            )}
          </div>
        </div>
        <button onClick={undoVisitor} style={{ padding: "8px 14px", background: "none", border: "1px solid #e0dedd", cursor: data.visitors > 0 ? "pointer" : "default", fontSize: 9, letterSpacing: 2, color: data.visitors > 0 ? "#888" : "#ccc" }}>Undo</button>
      </div>

      {/* ── 見込客 / 修理 / 購入 ────────────────────── */}
      <EntryList category="prospects" label="PROSPECT" />
      <EntryList category="repairs"   label="REPAIR" />
      <EntryList category="purchases" label="PURCHASE" />

      {/* ── Reset ────────────────────────────────────── */}
      <div style={{ marginTop: 10 }}>
        {confirmReset ? (
          <div style={{ background: "#fff", border: "1px solid #e0dedd", padding: "16px" }}>
            <div style={{ fontSize: 11, color: "#555", marginBottom: 4, lineHeight: 1.6 }}>リセットしてメモに記録します</div>
            {buildMemoLine() && <div style={{ fontSize: 10, fontFamily: "monospace", color: "#888", background: "#f5f4f2", padding: "6px 10px", marginBottom: 12 }}>{buildMemoLine()}</div>}
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => setConfirmReset(false)} style={{ flex: 1, padding: "11px 0", background: "none", border: "1px solid #ddd", cursor: "pointer", fontSize: 9, letterSpacing: 2, color: "#888" }}>Cancel</button>
              <button onClick={reset} style={{ flex: 1, padding: "11px 0", background: "#c0392b", border: "none", cursor: "pointer", fontSize: 9, letterSpacing: 2, color: "#fff" }}>Reset + Memo</button>
            </div>
          </div>
        ) : (
          <button
            onClick={() => setConfirmReset(true)}
            style={{ width: "100%", padding: "12px 0", background: "none", border: "1px solid #ddd", cursor: "pointer", fontSize: 9, letterSpacing: 3, textTransform: "uppercase", color: "#bbb" }}
          >Reset</button>
        )}
      </div>

      {/* ── Staff Picker Modal ────────────────────────── */}
      {staffPicker && (
        <div
          style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 200 }}
          onClick={() => setStaffPicker(null)}
        >
          <div style={{ background: "#fff", width: "100%", maxWidth: 480, padding: "24px 20px 40px" }} onClick={e => e.stopPropagation()}>
            <div style={{ fontSize: 9, letterSpacing: 3, color: "#bbb", textTransform: "uppercase", marginBottom: 20 }}>
              {staffPicker === "prospects" ? "見込客担当" : staffPicker === "repairs" ? "修理担当" : "販売 / サポート担当"}
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
              {MEMBERS.map(m => (
                <button key={m} onClick={() => addEntry(staffPicker, m)} style={{
                  padding: "16px 0", background: "#f5f4f2", border: "1px solid #e0dedd",
                  cursor: "pointer", fontSize: 14, fontWeight: 300, letterSpacing: 1, color: "#111"
                }}>{m}</button>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Main App ─────────────────────────────────────────────────
function ShiftManager() {
  const today = new Date();
  const [year, setYear]           = useState(today.getFullYear());
  const [month, setMonth]         = useState(today.getMonth() + 1);
  const [view, setView]           = useState("calendar");
  const [shifts, setShifts]       = useState({});
  const [editDay, setEditDay]     = useState(null);
  const [editData, setEditData]   = useState(null);
  const [loaded, setLoaded]       = useState(false);
  const [showImport, setShowImport] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [selectMode, setSelectMode] = useState(false);
  const [selected, setSelected] = useState([]);
  const [confirmMultiDelete, setConfirmMultiDelete] = useState(false);
  const [slideDir, setSlideDir] = useState(null);
  const [member, setMember]       = useState("成田");
  const [showMemberMenu, setShowMemberMenu] = useState(false);
  const [allShifts, setAllShifts] = useState({});

  const storageKey = `shifts:${member}:${year}-${String(month).padStart(2,"0")}`;

  useEffect(() => {
    setLoaded(false);
    setShifts({});
    setSelectMode(false);
    setSelected([]);
    const ym = `${year}-${String(month).padStart(2,"0")}`;
    const newKey = `shifts:${member}:${ym}`;
    const oldKey = `shifts:${ym}`;
    let raw = null;
    try { raw = storage.get(newKey); } catch(e) {}
    if (!raw && member === "成田") {
      let oldRaw = null;
      try { oldRaw = storage.get(oldKey); } catch(e) {}
      if (oldRaw) { storage.set(newKey, oldRaw); raw = oldRaw; }
    }
    if (raw) {
      setShifts(JSON.parse(raw));
    } else if (year === 2026 && month === 3) {
      const initMap = {
        "成田": MARCH_2026_DATA,
        "正田": MARCH_2026_MASADA,
        "尾谷": MARCH_2026_OTANI,
        "淵原": MARCH_2026_FUCHIHARA,
      };
      const init = initMap[member];
      if (init) {
        setShifts(init);
        storage.set(newKey, JSON.stringify(init));
      }
    }
    setLoaded(true);
    // 全メンバーのシフトを読み込む
    const ym2 = `${year}-${String(month).padStart(2,"0")}`;
    const all = {};
    MEMBERS.forEach(m => {
      if (m === member) return;
      try {
        const r = storage.get(`shifts:${m}:${ym2}`);
        if (r) all[m] = JSON.parse(r);
      } catch(e) {}
    });
    setAllShifts(all);
  }, [year, month, member]);

  const saveShifts = useCallback((s) => {
    setShifts(s);
    storage.set(storageKey, JSON.stringify(s));
  }, [storageKey]);

  const daysInMonth = new Date(year, month, 0).getDate();
  const firstDow    = new Date(year, month - 1, 1).getDay();

  const stats = (() => {
    let work = 0, off = 0, totalH = 0, hasTime = false;
    for (let d = 1; d <= daysInMonth; d++) {
      const s = shifts[dateKey(year, month, d)];
      if (!s) continue;
      if (s.status === "休日") off++;
      else { work++; const h = calcHours(s.startTime, s.endTime, s.breakTime ?? 60); if (h) { totalH += h; hasTime = true; } }
    }
    return { work, off, totalH: hasTime ? totalH : null };
  })();

  function openEdit(day) {
    const k = dateKey(year, month, day);
    setEditDay(day);
    setEditData(shifts[k] || { status: "出勤", startTime: "", endTime: "", breakTime: 60, memo: "" });
    setConfirmDelete(false);
  }
  function saveEdit() {
    saveShifts({ ...shifts, [dateKey(year, month, editDay)]: { ...editData } });
    setEditDay(null);
  }
  function deleteEntry() {
    const n = { ...shifts };
    delete n[dateKey(year, month, editDay)];
    saveShifts(n);
    setEditDay(null);
    setConfirmDelete(false);
  }
  function toggleSelect(day) {
    setSelected(prev => prev.includes(day) ? prev.filter(d => d !== day) : [...prev, day]);
  }
  function deleteSelected() {
    const n = { ...shifts };
    selected.forEach(d => delete n[dateKey(year, month, d)]);
    saveShifts(n);
    setSelected([]);
    setSelectMode(false);
    setConfirmMultiDelete(false);
  }
  const prevMonth = () => { setSlideDir("right"); if (month === 1) { setYear(y => y - 1); setMonth(12); } else setMonth(m => m - 1); };
  const nextMonth = () => { setSlideDir("left");  if (month === 12) { setYear(y => y + 1); setMonth(1); } else setMonth(m => m + 1); };
  const goToday   = () => { setSlideDir(null); setYear(today.getFullYear()); setMonth(today.getMonth() + 1); };

  const todayY = today.getFullYear();
  const todayM = today.getMonth() + 1;
  const todayD = today.getDate();
  const isCurrentMonth = year === todayY && month === todayM;
  const todayShift = isCurrentMonth ? shifts[dateKey(todayY, todayM, todayD)] : null;

  const labelSm = { fontSize: 9, letterSpacing: 3, color: "#aaa", textTransform: "uppercase", marginBottom: 8, display: "block" };

  return (
    <div className="shift-app">
      {/* ── Header ─────────────────────────────────── */}
      <div style={{ background: "#fff", borderBottom: "1px solid #e0dedd" }} className="safe-top">
        <div style={{ padding: "16px 20px 0" }}>

          {/* Title row */}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 20, position: "relative" }}>
            <div>
              <div style={{ fontSize: 9, letterSpacing: 4, color: "#999", textTransform: "uppercase", marginBottom: 4 }}>Shift Manager</div>
              <button onClick={() => setShowMemberMenu(v => !v)} style={{
                background: "none", border: "none", cursor: "pointer", padding: 0,
                display: "flex", alignItems: "center", gap: 6
              }}>
                <span style={{ fontSize: 22, fontWeight: 300, letterSpacing: 1, color: "#111" }}>{member}</span>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#aaa" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              {showMemberMenu && (
                <div style={{ position: "absolute", top: 56, left: 20, background: "#fff", border: "1px solid #e0dedd", zIndex: 50, minWidth: 100 }}>
                  {MEMBERS.map(m => (
                    <button key={m} onClick={() => { setMember(m); setShowMemberMenu(false); }} style={{
                      display: "block", width: "100%", padding: "10px 16px", background: m === member ? "#f5f4f2" : "#fff",
                      border: "none", cursor: "pointer", textAlign: "left",
                      fontSize: 13, fontWeight: m === member ? 500 : 300, color: "#111", letterSpacing: 0.5
                    }}>{m}</button>
                  ))}
                </div>
              )}
              {/* Today's shift */}
              <div style={{ marginTop: 6, fontSize: 11, color: "#aaa", display: "flex", alignItems: "center", gap: 6 }}>
                <span style={{ fontSize: 9, letterSpacing: 2, textTransform: "uppercase", color: "#ccc" }}>Today</span>
                {todayShift
                  ? todayShift.status === "休日"
                    ? <span style={{ color: "#ccc", letterSpacing: 1 }}>Off</span>
                    : <span style={{ color: "#111", fontWeight: 400 }}>
                        {todayShift.startTime || "—"}{todayShift.endTime ? ` – ${todayShift.endTime}` : ""}
                        {todayShift.memo ? <span style={{ color: "#bbb", fontSize: 10, marginLeft: 6 }}>{todayShift.memo}</span> : null}
                      </span>
                  : <span style={{ color: "#ddd" }}>—</span>
                }
              </div>
              {/* Next day's shift */}
              {(() => {
                const nextDay = new Date(today.getFullYear(), today.getMonth(), today.getDate() + 1);
                const nk = dateKey(nextDay.getFullYear(), nextDay.getMonth() + 1, nextDay.getDate());
                const ns = shifts[nk];
                return (
                  <div style={{ marginTop: 3, fontSize: 11, color: "#aaa", display: "flex", alignItems: "center", gap: 6 }}>
                    <span style={{ fontSize: 9, letterSpacing: 2, textTransform: "uppercase", color: "#ddd" }}>Next</span>
                    {ns
                      ? ns.status === "休日"
                        ? <span style={{ color: "#ddd", letterSpacing: 1 }}>Off</span>
                        : <span style={{ color: "#aaa", fontWeight: 300 }}>
                            {ns.startTime || "—"}{ns.endTime ? ` – ${ns.endTime}` : ""}
                            {ns.memo ? <span style={{ color: "#ccc", fontSize: 10, marginLeft: 6 }}>{ns.memo}</span> : null}
                          </span>
                      : <span style={{ color: "#ddd" }}>—</span>
                    }
                  </div>
                );
              })()}
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 6, alignItems: "flex-end" }}>
              <button onClick={() => setShowImport(true)} className="icon-btn" style={{
                display: "flex", alignItems: "center", gap: 6, background: "none",
                border: "1px solid #111", padding: "6px 12px", cursor: "pointer",
                fontSize: 10, letterSpacing: 1.5, textTransform: "uppercase", color: "#111"
              }}>
                <IconCamera /> Scan
              </button>
              {member === "成田" && Object.values(shifts).some(s => s?.status === "出勤") && (
                <button onClick={() => downloadICS(shifts, member, year, month)} className="icon-btn" style={{
                  display: "flex", alignItems: "center", gap: 6, background: "none",
                  border: "1px solid #888", padding: "6px 12px", cursor: "pointer",
                  fontSize: 10, letterSpacing: 1.5, textTransform: "uppercase", color: "#888"
                }}>
                  iCal
                </button>
              )}
            </div>
          </div>

          {/* Month nav */}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
            <button onClick={prevMonth} className="icon-btn" style={{ background: "none", border: "none", cursor: "pointer", color: "#111", padding: 4 }}><IconChevronL /></button>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ fontSize: 13, fontWeight: 400, letterSpacing: 2, textTransform: "uppercase" }}>{year} / {String(month).padStart(2,"0")}</span>
              {!isCurrentMonth && (
                <button onClick={goToday} style={{
                  background: "none", border: "1px solid #ddd", padding: "2px 8px", cursor: "pointer",
                  fontSize: 9, letterSpacing: 1.5, textTransform: "uppercase", color: "#aaa"
                }}>Today</button>
              )}
            </div>
            <button onClick={nextMonth} className="icon-btn" style={{ background: "none", border: "none", cursor: "pointer", color: "#111", padding: 4 }}><IconChevronR /></button>
          </div>

          {/* Stats */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", borderTop: "1px solid #e0dedd" }}>
            {[["WORK", stats.work], ["OFF", stats.off], ["HOURS", stats.totalH !== null ? formatHours(stats.totalH) : "—"]].map(([label, value], i) => (
              <div key={i} style={{ padding: "12px 0", textAlign: "center", borderRight: i < 2 ? "1px solid #e0dedd" : "none" }}>
                <div style={{ fontSize: 8, letterSpacing: 3, color: "#aaa", textTransform: "uppercase", marginBottom: 3 }}>{label}</div>
                <div style={{ fontSize: 17, fontWeight: 300 }}>{value}</div>
              </div>
            ))}
          </div>

          {/* Tabs */}
          <div style={{ display: "flex", borderTop: "1px solid #e0dedd", alignItems: "center" }}>
            {["calendar", "list", "counter"].map(v => (
              <button key={v} onClick={() => { setView(v); setSelectMode(false); setSelected([]); }} style={{
                flex: 1, padding: "10px 0", background: "none", border: "none", cursor: "pointer",
                fontSize: 9, letterSpacing: 3, textTransform: "uppercase",
                color: view === v ? "#111" : "#bbb",
                borderBottom: view === v ? "1.5px solid #111" : "1.5px solid transparent",
                transition: "all 0.2s"
              }}>{v === "calendar" ? "Cal" : v === "list" ? "List" : "Counter"}</button>
            ))}
            {view === "list" && (
              <button onClick={() => { setSelectMode(s => !s); setSelected([]); setConfirmMultiDelete(false); }} style={{
                padding: "10px 14px", background: "none", border: "none", cursor: "pointer",
                fontSize: 9, letterSpacing: 2, textTransform: "uppercase",
                color: selectMode ? "#c0392b" : "#bbb",
                borderBottom: selectMode ? "1.5px solid #c0392b" : "1.5px solid transparent",
                transition: "all 0.2s", flexShrink: 0
              }}>{selectMode ? "Cancel" : "Select"}</button>
            )}
          </div>
        </div>
      </div>

      {/* ── Content ────────────────────────────────── */}
      {view === "counter"
        ? <CounterView member={member} year={year} month={month} shifts={shifts} saveShifts={saveShifts} />
        : <div
            key={`${year}-${month}`}
            className={slideDir === "left" ? "slide-in-left" : slideDir === "right" ? "slide-in-right" : ""}
            style={{ paddingBottom: selectMode ? 80 : 20, padding: "20px 16px" }}
            onTouchStart={e => { const t = e.touches[0]; e.currentTarget._tx = t.clientX; e.currentTarget._ty = t.clientY; }}
            onTouchEnd={e => {
              const dx = e.changedTouches[0].clientX - e.currentTarget._tx;
              const dy = e.changedTouches[0].clientY - e.currentTarget._ty;
              if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
                if (dx < 0) nextMonth(); else prevMonth();
              }
            }}
          >
            {!loaded
              ? <div style={{ textAlign: "center", padding: 60, fontSize: 11, letterSpacing: 2, color: "#bbb", textTransform: "uppercase" }}>Loading</div>
              : view === "calendar"
                ? <CalendarView year={year} month={month} daysInMonth={daysInMonth} firstDow={firstDow} shifts={shifts} onDayClick={openEdit} allShifts={allShifts} />

      {/* ── Multi Delete Bar ───────────────────────── */}
      {selectMode && (

            {confirmDelete ? (

}

// ── Import Modal ─────────────────────────────────────────────
function ImportModal({ onClose, saveShifts }) {
  const [tab, setTab] = useState("scan"); // "scan" | "json"
  const [copied, setCopied] = useState(false);
  const [jsonText, setJsonText] = useState("");
  const [jsonError, setJsonError] = useState("");
  const [jsonSuccess, setJsonSuccess] = useState(false);

  const prompt = `シフト表のスクショを添付します。全員（成田・正田・尾谷・淵原）の列を読み取り、index.htmlのシフトデータを更新してGitHubへpushしてください。`;

  const promptJson = `シフト表のスクショを添付します。全員（成田・正田・尾谷・淵原）の列を読み取って、全員分のシフトデータを以下のJSON形式で出力してください（コードブロック不要）:\n{"members":{"成田":{"shifts":{"2026-03-03":{"status":"出勤","startTime":"09:30","endTime":"18:30","breakTime":60,"memo":""}}},"正田":{"shifts":{}},"尾谷":{"shifts":{}},"淵原":{"shifts":{}}}}`;

  const [copiedJson, setCopiedJson] = useState(false);

  function copyPrompt() {
    navigator.clipboard.writeText(prompt).catch(() => {}).finally(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    });
  }

  function copyPromptJson() {
    navigator.clipboard.writeText(promptJson).catch(() => {}).finally(() => {
      setCopiedJson(true);
      setTimeout(() => setCopiedJson(false), 2000);
    });
  }

  function applyJson() {
    setJsonError("");
    try {
      const cleaned = jsonText.trim()
        .replace(/^```[a-z]*\n?/i, '').replace(/\n?```$/i, '') // コードブロック除去
        .replace(/[\u200B-\u200D\uFEFF\u00A0\u2028\u2029]/g, '')
        .replace(/[\u201C\u201D\u201E\u201F\u2033\u2036]/g, '"')
        .replace(/[\u2018\u2019\u201A\u201B\u2032\u2035]/g, "'")
        .replace(/[\u2010-\u2015\u2212]/g, '-');
      const data = JSON.parse(cleaned);

      // 複数メンバー形式: { members: { 成田: { shifts: {...} }, ... } }
      // 単一メンバー形式: { year, month, shifts: {...} }
      if (data.members) {
        let count = 0;
        Object.entries(data.members).forEach(([name, memberData]) => {
          if (!memberData.shifts) return;
          const keys = Object.keys(memberData.shifts);
          const groups = {};
          keys.forEach(k => {
            const [y, m] = k.split("-");
            const gk = `${y}-${m}`;
            if (!groups[gk]) groups[gk] = {};
            groups[gk][k] = memberData.shifts[k];
          });
          Object.entries(groups).forEach(([ym, shifts]) => {
            const storeKey = `shifts:${name}:${ym}`;
            const existing = (() => { try { return storage.get(storeKey); } catch(e) { return null; } })();
            const merged = existing ? { ...JSON.parse(existing), ...shifts } : shifts;
            storage.set(storeKey, JSON.stringify(merged));
            count++;
          });
        });
        if (count === 0) throw new Error("有効なデータが見つかりません");
      } else {
        // 従来の単一形式
        if (!data.shifts || typeof data.shifts !== "object") throw new Error("shiftsが見つかりません");
        const keys = Object.keys(data.shifts);
        if (keys.length === 0) throw new Error("シフトデータが空です");
        const groups = {};
        keys.forEach(k => {
          const [y, m] = k.split("-");
          const gk = `${y}-${m}`;
          if (!groups[gk]) groups[gk] = {};
          groups[gk][k] = data.shifts[k];
        });
        const targetMember = data.member || "成田";
        Object.entries(groups).forEach(([ym, shifts]) => {
          const storeKey = `shifts:${targetMember}:${ym}`;
          const existing = (() => { try { return storage.get(storeKey); } catch(e) { return null; } })();
          const merged = existing ? { ...JSON.parse(existing), ...shifts } : shifts;
          storage.set(storeKey, JSON.stringify(merged));
        });
      }

      setJsonSuccess(true);
      setTimeout(() => { onClose(); window.location.reload(); }, 1200);
    } catch(e) {
      setJsonError(`エラー: ${e.message}`);
    }
  }

  const tabBtn = (id, label) => (
    <button onClick={() => setTab(id)} style={{
      flex: 1, padding: "9px 0", background: "none", border: "none", cursor: "pointer",
      fontSize: 9, letterSpacing: 2, textTransform: "uppercase",
      color: tab === id ? "#111" : "#bbb",
      borderBottom: tab === id ? "1.5px solid #111" : "1.5px solid transparent",
      transition: "all 0.2s"
    }}>{label}</button>
  );

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 200 }} onClick={onClose}>
      <div style={{ background: "#fff", width: "100%", maxWidth: 480, padding: "28px 24px 44px", maxHeight: "90vh", overflowY: "auto" }} onClick={e => e.stopPropagation()}>

        {/* Header */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 20 }}>
          <div>
            <div style={{ fontSize: 9, letterSpacing: 4, color: "#aaa", textTransform: "uppercase", marginBottom: 4 }}>Import</div>
            <div style={{ fontSize: 20, fontWeight: 300 }}>Shift Data</div>
          </div>
          <button onClick={onClose} className="icon-btn" style={{ background: "none", border: "none", cursor: "pointer", color: "#111", padding: 4 }}><IconClose /></button>
        </div>

        {/* Tabs */}
        <div style={{ display: "flex", borderBottom: "1px solid #e0dedd", marginBottom: 24 }}>
          {tabBtn("scan", "Scan")}
          {tabBtn("json", "JSON")}
        </div>

        {/* Scan tab */}
        {tab === "scan" && (
          <>
            <div style={{
              padding: "14px 16px", marginBottom: 24,
              background: "#f5f4f2", borderLeft: "2px solid #ddd"
            }}>
              <div style={{ fontSize: 11, color: "#777", lineHeight: 1.7, fontFamily: "monospace", marginBottom: 12, wordBreak: "break-all", whiteSpace: "pre-wrap" }}>{prompt}</div>
              <button onClick={copyPrompt} style={{
                display: "flex", alignItems: "center", gap: 6,
                background: copied ? "#111" : "none",
                border: `1px solid ${copied ? "#111" : "#bbb"}`,
                padding: "6px 14px", cursor: "pointer",
                fontSize: 9, letterSpacing: 2, textTransform: "uppercase",
                color: copied ? "#fff" : "#888", transition: "all 0.2s"
              }}>
                {copied ? <><IconCheck /> Copied!</> : "Copy Prompt"}
              </button>
            </div>

            {["スクショを撮る", "Open Claude をタップ", "画像を添付して送信", "自動でGitHubへ反映される"].map((s, i) => (
              <div key={i} style={{ display: "flex", gap: 14, alignItems: "flex-start", marginBottom: 14 }}>
                <div style={{ fontSize: 10, letterSpacing: 1, color: "#bbb", minWidth: 20 }}>0{i+1}</div>
                <div style={{ flex: 1, height: 1, background: "#e0dedd", marginTop: 8, maxWidth: 16 }} />
                <div style={{ flex: 1, fontSize: 13, fontWeight: 300, color: i === 3 ? "#111" : "#444", lineHeight: 1.6 }}>{s}</div>
              </div>
            ))}

            <a href="https://claude.ai/code/session_01FCPrwRvZGSGRp25Ra8KmBM" target="_blank" rel="noopener noreferrer" style={{
              display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
              width: "100%", marginTop: 8, marginBottom: 12, padding: "13px 0",
              background: "#f5f4f2", color: "#111", textDecoration: "none",
              fontSize: 10, letterSpacing: 3, textTransform: "uppercase",
              border: "1px solid #e0dedd"
            }}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              Open Claude
            </a>

            <button onClick={onClose} className="primary-btn" style={{
              width: "100%", marginTop: 8, padding: "13px 0", background: "#111", color: "#fff",
              border: "none", cursor: "pointer", fontSize: 10, letterSpacing: 3, textTransform: "uppercase"
            }}>Close</button>
          </>
        )}

        {/* JSON tab */}
        {tab === "json" && (
          <>
            <div style={{
              padding: "14px 16px", marginBottom: 16,
              background: "#f5f4f2", borderLeft: "2px solid #ddd"
            }}>
              <div style={{ fontSize: 10, letterSpacing: 2, textTransform: "uppercase", color: "#bbb", marginBottom: 8 }}>Manual Prompt</div>
              <div style={{ fontSize: 11, color: "#777", lineHeight: 1.7, fontFamily: "monospace", marginBottom: 12, wordBreak: "break-all", whiteSpace: "pre-wrap" }}>{promptJson}</div>
              <button onClick={copyPromptJson} style={{
                display: "flex", alignItems: "center", gap: 6,
                background: copiedJson ? "#111" : "none",
                border: `1px solid ${copiedJson ? "#111" : "#bbb"}`,
                padding: "6px 14px", cursor: "pointer",
                fontSize: 9, letterSpacing: 2, textTransform: "uppercase",
                color: copiedJson ? "#fff" : "#888", transition: "all 0.2s"
              }}>
                {copiedJson ? <><IconCheck /> Copied!</> : "Copy Prompt"}
              </button>
            </div>

            {["スクショを撮る", "Claudeのチャット画面へ移動", "画像を添付 → プロンプトを貼り付けて送信", "返ってきたJSONをコピー → 下に貼って Apply"].map((s, i) => (
              <div key={i} style={{ display: "flex", gap: 14, alignItems: "flex-start", marginBottom: 14 }}>
                <div style={{ fontSize: 10, letterSpacing: 1, color: "#bbb", minWidth: 20 }}>0{i+1}</div>
                <div style={{ flex: 1, height: 1, background: "#e0dedd", marginTop: 8, maxWidth: 16 }} />
                <div style={{ flex: 1, fontSize: 13, fontWeight: 300, color: i === 3 ? "#111" : "#444", lineHeight: 1.6 }}>{s}</div>
              </div>
            ))}

            <div style={{ fontSize: 12, color: "#aaa", marginBottom: 12, marginTop: 4, lineHeight: 1.7 }}>

            <textarea
              value={jsonText}
              onChange={e => { setJsonText(e.target.value); setJsonError(""); setJsonSuccess(false); }}

              <div style={{ fontSize: 11, color: "#2a7a2a", marginBottom: 12, padding: "8px 12px", background: "#f5fff5", borderLeft: "2px solid #2a7a2a", display: "flex", alignItems: "center", gap: 6 }}>

            <button onClick={applyJson} className="primary-btn" style={{

// ── Calendar View ────────────────────────────────────────────
function CalendarView({ year, month, daysInMonth, firstDow, shifts, onDayClick, allShifts = {} }) {
  const today = new Date();
  const todayY = today.getFullYear();
  const todayM = today.getMonth() + 1;
  const todayD = today.getDate();

  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);

  return (
    <div style={{ background: "#fff", padding: "16px 12px" }}>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", marginBottom: 8 }}>
        {WEEKDAY_JP.map((d, i) => (
          <div key={d} style={{ textAlign: "center", fontSize: 9, letterSpacing: 2, textTransform: "uppercase", color: i === 0 ? "#c0392b" : i === 6 ? "#555" : "#bbb", padding: "4px 0" }}>{d}</div>
        ))}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 2 }}>
        {cells.map((day, i) => {
          if (!day) return <div key={i} />;
          const dow = (firstDow + day - 1) % 7;
          const k = dateKey(year, month, day);
          const data = shifts[k];
          const isOff = data?.status === "休日";
          const isToday = year === todayY && month === todayM && day === todayD;
          const isEarly = !isOff && data?.startTime && (() => {
            const [h, m] = data.startTime.split(":").map(Number);
            const mins = h * 60 + m;
            return mins >= 9 * 60 + 30 && mins <= 10 * 60;
          })();
          const isLate = !isOff && data?.startTime && (() => {
            const [h, m] = data.startTime.split(":").map(Number);
            return h * 60 + m >= 11 * 60;
          })();
          // 同じ日に出勤している他メンバー
          const sameDay = Object.entries(allShifts)
            .filter(([, ms]) => ms[k]?.status === "出勤")
            .map(([name]) => name.slice(0, 1)); // 苗字1文字
          return (
            <button key={i} onClick={() => onDayClick(day)} className="cal-day" style={{
              border: "none", padding: "8px 4px 8px", cursor: "pointer",
              background: isToday ? "#f0f0ef" : !data ? "transparent" : isOff ? "#f5f4f2" : "#fff",
              display: "flex", flexDirection: "column", alignItems: "center", gap: 3, minHeight: 60,
              borderTop: isToday ? "2px solid #111" : isOff ? "2px solid #ddd" : isEarly ? "2px solid #c9a84c" : isLate ? "2px solid #2d6a4f" : data ? "2px solid #111" : "2px solid #eee",
              outline: "none", transition: "background 0.15s", position: "relative"
            }}>
              <span style={{
                fontSize: 13, fontWeight: isToday ? 600 : 300,
                color: isToday ? "#111" : !data ? "#ccc" : isOff ? "#ccc" : dow === 0 ? "#c0392b" : "#111"
              }}>{day}</span>
              {data && !isOff && <span style={{ fontSize: 10, color: "#888", fontWeight: 300 }}>{data.startTime}</span>}
              {isOff && <span style={{ fontSize: 8, letterSpacing: 1.5, color: "#ccc", textTransform: "uppercase" }}>Off</span>}
              {data?.memo && !isOff && <span style={{ width: 3, height: 3, background: "#111", borderRadius: "50%" }} />}
              {!isOff && sameDay.length > 0 && (
                <div style={{ display: "flex", gap: 2, flexWrap: "wrap", justifyContent: "center" }}>
                  {sameDay.map(n => (
                    <span key={n} style={{ fontSize: 7, color: "#aaa", letterSpacing: 0.5 }}>{n}</span>
                  ))}
                </div>
              )}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ── List View ────────────────────────────────────────────────
function ListView({ year, month, daysInMonth, shifts, onDayClick, selectMode, selected, onToggle, allShifts = {} }) {
  return (
    <div style={{ background: "#fff" }}>
      {Array.from({ length: daysInMonth }, (_, i) => i + 1).map(day => {
        const dow = new Date(year, month - 1, day).getDay();
        const k = dateKey(year, month, day);
        const data = shifts[k];
        const isOff = data?.status === "休日";
        const hours = data && !isOff ? calcHours(data.startTime, data.endTime, data.breakTime ?? 60) : null;
        const isSelected = selected?.includes(day);
        // 他メンバーで出勤している人
        const others = Object.entries(allShifts)
          .filter(([, ms]) => ms[k]?.status === "出勤")
          .map(([name, ms]) => ({ name, startTime: ms[k].startTime }));

        return (
          <button key={day} onClick={() => selectMode ? onToggle(day) : onDayClick(day)} className="list-row" style={{
            display: "flex", alignItems: "center", background: isSelected ? "#f0eeec" : "transparent", border: "none",
            borderBottom: "1px solid #f0eeec", padding: "12px 16px", cursor: "pointer", gap: 16,
            width: "100%", textAlign: "left", transition: "background 0.1s"
          }}>
            {/* Select checkbox */}
            {selectMode && (
              <div style={{
                width: 18, height: 18, borderRadius: "50%", flexShrink: 0,
                border: isSelected ? "none" : "1.5px solid #ccc",
                background: isSelected ? "#111" : "transparent",
                display: "flex", alignItems: "center", justifyContent: "center"
              }}>
                {isSelected && <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>}
              </div>
            )}
            <div style={{ width: 48, flexShrink: 0, display: "flex", alignItems: "baseline", gap: 4 }}>
              <span style={{ fontSize: 17, fontWeight: 300, color: dow === 0 ? "#c0392b" : "#111" }}>{day}</span>
              <span style={{ fontSize: 9, letterSpacing: 1, color: dow === 0 ? "#c0392b" : "#bbb", textTransform: "uppercase" }}>{WEEKDAY_JP[dow]}</span>
            </div>
            <div style={{ flex: 1 }}>
              {!data
                ? <span style={{ fontSize: 11, color: "#ddd" }}>—</span>
                : isOff
                  ? <span style={{ fontSize: 10, letterSpacing: 2, textTransform: "uppercase", color: "#bbb" }}>Off</span>
                  : <div>
                      <span style={{ fontSize: 13, fontWeight: 300, color: "#333" }}>{data.startTime || "—"}{data.endTime ? ` – ${data.endTime}` : ""}</span>
                      {hours && <span style={{ fontSize: 10, color: "#bbb", marginLeft: 10, letterSpacing: 1 }}>{formatHours(hours)}</span>}
                      {data.memo && <div style={{ fontSize: 10, color: "#bbb", marginTop: 2, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{data.memo}</div>}
                    </div>
              }
              {!isOff && others.length > 0 && (
                <div style={{ display: "flex", gap: 8, marginTop: 4, flexWrap: "wrap" }}>
                  {others.map(({ name, startTime }) => (
                    <span key={name} style={{ fontSize: 9, color: "#bbb", letterSpacing: 0.5 }}>
                      {name} {startTime}
                    </span>
                  ))}
                </div>
              )}
            </div>
            {!selectMode && <span style={{ color: "#ddd" }}><IconArrow /></span>}
          </button>
        );
      })}
    </div>
  );
}

// ── Mount ────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ShiftManager />);
</script>

</body>
