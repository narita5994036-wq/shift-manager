// ── Helpers ──────────────────────────────────────────────────
function dateKey(y, m, d) {
  return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}
function calcHours(start, end, breakMin = 60) {
  if (!start || !end) return null;
  const [sh, sm] = start.split(":").map(Number);
  const [eh, em] = end.split(":").map(Number);
  const diff = (eh * 60 + em) - (sh * 60 + sm) - breakMin;
  return diff > 0 ? diff / 60 : null;
}
function defaultEndTime(start) {
  if (!start) return "";
  const [h, m] = start.split(":").map(Number);
  const total = h * 60 + m + 9 * 60; // 9時間後
  return `${String(Math.floor(total / 60) % 24).padStart(2,"0")}:${String(total % 60).padStart(2,"0")}`;
}
function formatHours(h) {
  const hours = Math.floor(h);
  const mins = Math.round((h - hours) * 60);
  return mins > 0 ? `${hours}h ${mins}m` : `${hours}h`;
}

// ── ICS Export ───────────────────────────────────────────────
function generateICS(shifts, memberName, year, month) {
  const pad = n => String(n).padStart(2, "0");
  // JST→UTC: subtract 9 hours
  function toUTC(dateStr, timeStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    const [h, min] = timeStr.split(":").map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d, h - 9, min, 0));
    return `${dt.getUTCFullYear()}${pad(dt.getUTCMonth()+1)}${pad(dt.getUTCDate())}T${pad(dt.getUTCHours())}${pad(dt.getUTCMinutes())}00Z`;
  }
  const lines = [
    "BEGIN:VCALENDAR", "VERSION:2.0",
    "PRODID:-//ShiftManager//JP", "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
  ];
  Object.entries(shifts).sort().forEach(([dateStr, shift]) => {
    if (!shift || shift.status === "休日" || !shift.startTime) return;
    const dtStart = toUTC(dateStr, shift.startTime);
    const endT = shift.endTime || shift.startTime;
    const dtEnd = toUTC(dateStr, endT);
    const summary = `${memberName} 出勤 ${shift.startTime}${shift.endTime ? "–" + shift.endTime : ""}`;
    lines.push("BEGIN:VEVENT");
    lines.push(`DTSTART:${dtStart}`);
    lines.push(`DTEND:${dtEnd}`);
    lines.push(`SUMMARY:${summary}`);
    if (shift.memo) lines.push(`DESCRIPTION:${shift.memo.replace(/\n/g, "\\n")}`);
    lines.push(`UID:${memberName}-${dateStr}@shift-manager`);
    lines.push("END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  return lines.join("\r\n");
}
function downloadICS(shifts, memberName, year, month) {
  const content = generateICS(shifts, memberName, year, month);
  const blob = new Blob([content], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `shift-${memberName}-${year}-${String(month).padStart(2,"0")}.ics`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ── Storage (localStorage) ────────────────────────────────────
const storage = {
  get: (key) => { try { return localStorage.getItem(key); } catch { return null; } },
  set: (key, val) => { try { localStorage.setItem(key, val); } catch {} },
};

// ── データ移行: 中谷 → 平谷 ──────────────────────────────────
(() => {
  if (storage.get("migration:中谷→平谷")) return;
  try {
    const keys = Object.keys(localStorage);
    keys.forEach(key => {
      if (!key.startsWith("shifts:中谷:")) return;
      const newKey = key.replace("shifts:中谷:", "shifts:平谷:");
      const val = localStorage.getItem(key);
      if (val && !localStorage.getItem(newKey)) {
        localStorage.setItem(newKey, val);
      }
      localStorage.removeItem(key);
    });
    storage.set("migration:中谷→平谷", "1");
  } catch(e) {}
})();

const MEMBERS = ["成田", "正田", "尾谷", "平谷"];

    <div style={{ background: "#fff", border: "1px solid #e0dedd", padding: "16px 14px", marginBottom: 10 }}>
      <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 10 }}>

          <div style={{ fontSize: 9, letterSpacing: 2, color: "#bbb", marginBottom: 6 }}>{label}</div>

        <button onClick={onAdd}
          style={{ padding: "10px 18px", background: "#111", border: "none", cursor: "pointer", color: "#fff", fontSize: 18, lineHeight: 1, marginTop: 4 }}>＋</button>
      </div>
      {entries.length > 0 && (
        <>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 8 }}>

              <div key={m} style={{ fontSize: 10, color: "#555", background: "#f5f4f2", padding: "3px 10px" }}>{m} {counts[m]}</div>

          </div>
          {entries.map((e, i) => (
            <div key={i} style={{ borderTop: "1px solid #f0eeec", paddingTop: 8, marginTop: 2 }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: isProspect ? 6 : 0 }}>
                <div style={{ fontSize: 12, color: "#444" }}>{e.staff}</div>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <div style={{ fontSize: 10, color: "#aaa", letterSpacing: 1 }}>{e.time}</div>
                  <button onClick={() => onRemove(i)} style={{ background: "none", border: "none", cursor: "pointer", color: "#ccc", padding: 2, lineHeight: 1, fontSize: 14 }}>×</button>
                </div>

              {isProspect && (
                <div style={{ display: "flex", gap: 6, marginBottom: 6 }}>
                  {[0, 1, 2].map(fi => (
                    <input key={fi}
                      value={(e.frames || ["", "", ""])[fi]}

            </div>
          ))}
        </>
      )}

  );
}

// ── Counter View ──────────────────────────────────────────────
function CounterView({ member, year, month, shifts, saveShifts }) {
  const todayStr = (() => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  })();
  const todayLabel = (() => {
    const d = new Date();
    const days = ["日","月","火","水","木","金","土"];
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")} ${days[d.getDay()]}`;
  })();
  const storageKey = `counter:${todayStr}`;

  const loadData = () => {
    try {
      const raw = storage.get(storageKey);
      if (raw) {
        const d = JSON.parse(raw);
        if (typeof d.visitors  === "number") d.visitors  = [];
        if (typeof d.prospects === "number") d.prospects = [];
        if (typeof d.repairs   === "number") d.repairs   = [];
        // migrate old purchase format { staff } → { salesperson, supporter }
        d.purchases = (d.purchases || []).map(p =>
          p.salesperson !== undefined ? p : { salesperson: p.staff, supporter: null, time: p.time }
        );
        return d;
      }
    } catch(e) {}
    return { visitors: [], prospects: [], repairs: [], purchases: [] };
  };

  const [data, setData]               = useState(loadData);
  const [flashVisitor, setFlashVisitor] = useState(false);
  const [staffPicker, setStaffPicker]   = useState(null);    // null | "prospects" | "repairs"
  const [purchaseFlow, setPurchaseFlow] = useState(null);    // null | { step:1 } | { step:2, salesperson }
  const [confirmReset, setConfirmReset] = useState(false);
  const [memoCopied, setMemoCopied]     = useState(false);

  function persist(next) {
    setData(next);
    try { storage.set(storageKey, JSON.stringify(next)); } catch(e) {}
  }

  function nowTime() {
    const n = new Date();
    return `${String(n.getHours()).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}`;
  }

  // ── Visitors ─────────────────────────────────────
  function incVisitor(type) {
    persist({ ...data, visitors: [...data.visitors, { time: nowTime(), type }] });
    setFlashVisitor(true);
    setTimeout(() => setFlashVisitor(false), 120);
  }
  function removeVisitor(i) {
    persist({ ...data, visitors: data.visitors.filter((_, idx) => idx !== i) });
  }

  // ── Prospects / Repairs ───────────────────────────
  function addEntry(category, staff) {
    persist({ ...data, [category]: [...data[category], { staff, time: nowTime(), frames: ["", "", ""] }] });
    setStaffPicker(null);
  }
  function removeEntry(category, i) {
    persist({ ...data, [category]: data[category].filter((_, idx) => idx !== i) });
  }
  function updateFrame(prospectIdx, frameIdx, value) {
    const next = data.prospects.map((p, i) => {
      if (i !== prospectIdx) return p;
      const frames = [...(p.frames || ["", "", ""])];
      frames[frameIdx] = value;
      return { ...p, frames };
    });
    persist({ ...data, prospects: next });
  }

  // ── Purchases (2-step) ────────────────────────────
  function pickSalesperson(staff) { setPurchaseFlow({ step: 2, salesperson: staff }); }
  function pickSupporter(staff) {   // staff=null means skip
    persist({ ...data, purchases: [...data.purchases, { salesperson: purchaseFlow.salesperson, supporter: staff, time: nowTime(), frames: ["", "", ""] }] });
    setPurchaseFlow(null);
  }
  function updatePurchaseFrame(purchaseIdx, frameIdx, value) {
    const next = data.purchases.map((p, i) => {
      if (i !== purchaseIdx) return p;
      const frames = [...(p.frames || ["", "", ""])];
      frames[frameIdx] = value;
      return { ...p, frames };
    });
    persist({ ...data, purchases: next });
  }
  function removePurchase(i) {
    persist({ ...data, purchases: data.purchases.filter((_, idx) => idx !== i) });
  }

  // ── Memo / Reset ──────────────────────────────────
  function staffSummary(entries, key = "staff") {
    return MEMBERS.map(m => {
      const n = entries.filter(e => e[key] === m).length;
      return n > 0 ? `${m}${n}` : null;
    }).filter(Boolean).join("・");
  }

  function buildMemoLine() {
    const vCount  = data.visitors.length;
    const prCount = data.prospects.length;
    const rCount  = data.repairs.length;
    const pCount  = data.purchases.length;
    const total   = vCount + prCount + rCount;
    const parts   = [];
    if (total   > 0) {
      const domestic = data.visitors.filter(v => v.type !== "overseas").length + prCount + rCount;
      const overseas = data.visitors.filter(v => v.type === "overseas").length;
      const breakdown = overseas > 0 ? `国内${domestic}・海外${overseas}` : null;
      parts.push(`来店${total}${breakdown ? `(${breakdown})` : ""}`);
    }
    const framesSummary = (entries) => entries.flatMap(e => (e.frames || []).filter(Boolean)).join("・");
    if (prCount > 0) { const s = staffSummary(data.prospects); const f = framesSummary(data.prospects); parts.push(`見込${prCount}${s ? `(${s})` : ""}${f ? `[${f}]` : ""}`); }
    if (rCount  > 0) { const s = staffSummary(data.repairs);   parts.push(`修理${rCount}${s ? `(${s})` : ""}`); }
    if (pCount  > 0) { const s = staffSummary(data.purchases, "salesperson"); const f = framesSummary(data.purchases); parts.push(`購入${pCount}${s ? `(${s})` : ""}${f ? `[${f}]` : ""}`); }
    return parts.join(" / ");
  }

  function copyToMemo() {
    const memo = buildMemoLine();
    if (!memo || !shifts || !saveShifts) return;
    const existing = shifts[todayStr];
    if (existing) {
      const prev = existing.memo ? existing.memo.trim() : "";
      saveShifts({ ...shifts, [todayStr]: { ...existing, memo: prev ? `${prev}\n${memo}` : memo } });
    }
    setMemoCopied(true);
    setTimeout(() => setMemoCopied(false), 1500);
  }

  function reset() {
    const memo = buildMemoLine();
    if (memo && shifts && saveShifts) {
      const existing = shifts[todayStr];
      if (existing) {
        const prev = existing.memo ? existing.memo.trim() : "";
        saveShifts({ ...shifts, [todayStr]: { ...existing, memo: prev ? `${prev}\n${memo}` : memo } });
      }
    }
    persist({ visitors: [], prospects: [], repairs: [], purchases: [] });
    setConfirmReset(false);
  }

  const totalVisitors = data.visitors.length + data.prospects.length + data.repairs.length;

  // ── Modal picker ──────────────────────────────────
  const modalOpen = staffPicker || purchaseFlow;
  const modalTitle = staffPicker === "prospects" ? "見込客担当" : staffPicker === "repairs" ? "修理担当"
    : purchaseFlow?.step === 1 ? "販売担当" : "サポート担当";

  function handleModalClose() { setStaffPicker(null); setPurchaseFlow(null); }
  function handleModalPick(m) {
    if (staffPicker) { addEntry(staffPicker, m); }
    else if (purchaseFlow?.step === 1) { pickSalesperson(m); }
    else { pickSupporter(m); }
  }

  return (
    <div style={{ padding: "24px 16px 60px" }}>
      <div style={{ fontSize: 10, letterSpacing: 3, color: "#bbb", textTransform: "uppercase", marginBottom: 16, textAlign: "center" }}>{todayLabel}</div>

      {/* ── TOTAL ───────────────────────────────────── */}
      <div style={{ textAlign: "center", marginBottom: 16 }}>
        <div style={{ fontSize: 72, fontWeight: 200, letterSpacing: -3, lineHeight: 1, color: flashVisitor ? "#555" : "#111", transition: "color 0.1s" }}>{totalVisitors}</div>
        <div style={{ fontSize: 9, letterSpacing: 3, color: "#bbb", marginTop: 4 }}>TOTAL VISITORS</div>
        {(data.prospects.length > 0 || data.repairs.length > 0) && (
          <div style={{ fontSize: 10, color: "#ccc", marginTop: 4 }}>
            直接{data.visitors.length}
            {data.prospects.length > 0 ? ` ＋ 見込${data.prospects.length}` : ""}
            {data.repairs.length   > 0 ? ` ＋ 修理${data.repairs.length}` : ""}
          </div>
        )}
      </div>

      {/* ── 来店ボタン ───────────────────────────────── */}
      <div style={{ background: "#fff", border: "1px solid #e0dedd", padding: "14px", marginBottom: 10 }}>
        <div style={{ fontSize: 9, letterSpacing: 2, color: "#bbb", marginBottom: 10 }}>
          VISITORS　<span style={{ fontSize: 18, fontWeight: 200, color: "#111", letterSpacing: -1 }}>{data.visitors.length}</span>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={() => incVisitor("domestic")} style={{
            flex: 1, padding: "18px 0",
            background: flashVisitor ? "#333" : "#111",
            border: "none", cursor: "pointer", color: "#fff",
            transition: "background 0.1s", WebkitTapHighlightColor: "transparent",
            display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 4,
            fontSize: 13, letterSpacing: 1
          }}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
            </svg>
            国内客
          </button>
          <button onClick={() => incVisitor("overseas")} style={{
            flex: 1, padding: "18px 0",
            background: flashVisitor ? "#333" : "#111",
            border: "none", cursor: "pointer", color: "#fff",
            transition: "background 0.1s", WebkitTapHighlightColor: "transparent",
            display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 4,
            fontSize: 13, letterSpacing: 1
          }}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
            海外客
          </button>
        </div>
        {data.visitors.length > 0 && (
          <div style={{ marginTop: 10 }}>
            {data.visitors.map((v, i) => (
              <div key={i} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "5px 0", borderTop: "1px solid #f0eeec" }}>
                <div style={{ fontSize: 10, color: v.type === "overseas" ? "#7a9abf" : "#aaa", letterSpacing: 1 }}>
                  {v.type === "overseas" ? "海外" : "国内"}
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <div style={{ fontSize: 10, color: "#aaa", letterSpacing: 1 }}>{v.time}</div>
                  <button onClick={() => removeVisitor(i)} style={{ background: "none", border: "none", cursor: "pointer", color: "#ccc", padding: 2, lineHeight: 1, fontSize: 14 }}>×</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* ── 見込 / 修理 / 購入 ──────────────────────── */}
      <EntryList entries={data.prospects} category="prospects" label="PROSPECT"
        onAdd={() => setStaffPicker("prospects")}
        onRemove={i => removeEntry("prospects", i)}
        onUpdateFrame={updateFrame} />
      <EntryList entries={data.repairs} category="repairs" label="REPAIR"
        onAdd={() => setStaffPicker("repairs")}
        onRemove={i => removeEntry("repairs", i)}
        onUpdateFrame={null} />
      <PurchaseList entries={data.purchases}
        onAdd={() => setPurchaseFlow({ step: 1 })}
        onRemove={removePurchase}
        onUpdateFrame={updatePurchaseFrame} />

      {/* ── Memo / Reset ────────────────────────────── */}
      <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 8 }}>
        {/* メモコピーボタン */}
        <button onClick={copyToMemo} disabled={!buildMemoLine()} style={{
          width: "100%", padding: "12px 0",
          background: memoCopied ? "#2d6a4f" : "none",
          border: `1px solid ${memoCopied ? "#2d6a4f" : "#ddd"}`,
          cursor: buildMemoLine() ? "pointer" : "default",
          fontSize: 9, letterSpacing: 3, textTransform: "uppercase",
          color: memoCopied ? "#fff" : buildMemoLine() ? "#555" : "#ccc",
          transition: "all 0.2s"
        }}>{memoCopied ? "Copied ✓" : "Copy to Memo"}</button>

        {/* リセット */}
        {confirmReset ? (
          <div style={{ background: "#fff", border: "1px solid #e0dedd", padding: "16px" }}>
            <div style={{ fontSize: 11, color: "#555", marginBottom: 4, lineHeight: 1.6 }}>リセットしてメモに記録します</div>
            {buildMemoLine() && <div style={{ fontSize: 10, fontFamily: "monospace", color: "#888", background: "#f5f4f2", padding: "6px 10px", marginBottom: 12 }}>{buildMemoLine()}</div>}
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => setConfirmReset(false)} style={{ flex: 1, padding: "11px 0", background: "none", border: "1px solid #ddd", cursor: "pointer", fontSize: 9, letterSpacing: 2, color: "#888" }}>Cancel</button>
              <button onClick={reset} style={{ flex: 1, padding: "11px 0", background: "#c0392b", border: "none", cursor: "pointer", fontSize: 9, letterSpacing: 2, color: "#fff" }}>Reset + Memo</button>
            </div>
          </div>
        ) : (
          <button onClick={() => setConfirmReset(true)}
            style={{ width: "100%", padding: "12px 0", background: "none", border: "1px solid #ddd", cursor: "pointer", fontSize: 9, letterSpacing: 3, textTransform: "uppercase", color: "#bbb" }}>Reset</button>
        )}
      </div>

      {/* ── Picker Modal ─────────────────────────────── */}
      {modalOpen && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 200 }}
          onClick={handleModalClose}>
          <div style={{ background: "#fff", width: "100%", maxWidth: 480, padding: "24px 20px 40px" }} onClick={e => e.stopPropagation()}>
            <div style={{ fontSize: 9, letterSpacing: 3, color: "#bbb", textTransform: "uppercase", marginBottom: 20 }}>{modalTitle}</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
              {MEMBERS.map(m => (
                <button key={m} onClick={() => handleModalPick(m)} style={{
                  padding: "16px 0", background: "#f5f4f2", border: "1px solid #e0dedd",
                  cursor: "pointer", fontSize: 14, fontWeight: 300, letterSpacing: 1, color: "#111"
                }}>{m}</button>
              ))}
            </div>
            {purchaseFlow?.step === 2 && (
              <button onClick={() => pickSupporter(null)} style={{
                width: "100%", marginTop: 10, padding: "13px 0", background: "none",
                border: "1px solid #ddd", cursor: "pointer", fontSize: 9, letterSpacing: 3, color: "#bbb"
              }}>Skip（サポートなし）</button>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// ── Main App ─────────────────────────────────────────────────
function ShiftManager() {
  const today = new Date();
  const [year, setYear]           = useState(today.getFullYear());
  const [month, setMonth]         = useState(today.getMonth() + 1);
  const [view, setView]           = useState("calendar");
  const [shifts, setShifts]       = useState({});
  const [editDay, setEditDay]     = useState(null);
  const [editData, setEditData]   = useState(null);
  const [loaded, setLoaded]       = useState(false);
  const [pdfLoadState, setPdfLoadState] = useState(null); // null | "loading" | "done" | "error"
  const [showPdfGuide, setShowPdfGuide] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [selectMode, setSelectMode] = useState(false);
  const [selected, setSelected] = useState([]);
  const [confirmMultiDelete, setConfirmMultiDelete] = useState(false);
  const [slideDir, setSlideDir] = useState(null);
  const monthLabelLastTap = React.useRef(0);
  const listTabLastTap = React.useRef(0);
  const modalSwipeX = React.useRef(null);
  const [member, setMember]       = useState("成田");
  const [showMemberMenu, setShowMemberMenu] = useState(false);
  const [allShifts, setAllShifts] = useState({});

  const storageKey = `shifts:${member}:${year}-${String(month).padStart(2,"0")}`;

  useEffect(() => {
    setLoaded(false);
    setShifts({});
    setSelectMode(false);
    setSelected([]);
    const ym = `${year}-${String(month).padStart(2,"0")}`;
    const newKey = `shifts:${member}:${ym}`;
    const oldKey = `shifts:${ym}`;
    let raw = null;
    try { raw = storage.get(newKey); } catch(e) {}
    if (!raw && member === "成田") {
      let oldRaw = null;
      try { oldRaw = storage.get(oldKey); } catch(e) {}
      if (oldRaw) { storage.set(newKey, oldRaw); raw = oldRaw; }
    }
    if (raw) {
      setShifts(JSON.parse(raw));
    } else if (year === 2026 && month === 3) {
      const initMap = {
        "成田": MARCH_2026_DATA,
        "正田": MARCH_2026_MASADA,
        "尾谷": MARCH_2026_OTANI,
        "平谷": MARCH_2026_FUCHIHARA,
      };
      const init = initMap[member];
      if (init) {
        setShifts(init);
        storage.set(newKey, JSON.stringify(init));
      }
    }
    setLoaded(true);
    // 全メンバーのシフトを読み込む
    const ym2 = `${year}-${String(month).padStart(2,"0")}`;
    const all = {};
    MEMBERS.forEach(m => {
      if (m === member) return;
      try {
        const r = storage.get(`shifts:${m}:${ym2}`);
        if (r) all[m] = JSON.parse(r);
      } catch(e) {}
    });
    setAllShifts(all);
  }, [year, month, member]);

  const saveShifts = useCallback((s) => {
    setShifts(s);
    storage.set(storageKey, JSON.stringify(s));
  }, [storageKey]);

  async function loadPDFData(y, m) {
    setPdfLoadState("loading");
    const url = `https://raw.githubusercontent.com/narita5994036-wq/shift-manager/main/data/shifts_${y}-${String(m).padStart(2,"0")}.json`;
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const pdfData = await res.json();
      // キーの前後の空白・不可視文字を除去して正規化
      Object.keys(pdfData).forEach(key => {
        const trimmed = key.trim();
        if (trimmed !== key) { pdfData[trimmed] = pdfData[key]; delete pdfData[key]; }
      });
      // 名前マッピング(PDFのキー → アプリのメンバー名)、大文字小文字・表記ゆれを許容
      const NAME_PATTERNS = [
        { pattern: /hiratani/i, to: "平谷" },
        { pattern: /^中谷$/, to: "平谷" },
      ];
      Object.keys(pdfData).forEach(key => {
        NAME_PATTERNS.forEach(({ pattern, to }) => {
          if (pattern.test(key) && key !== to) {
            if (!pdfData[to]) pdfData[to] = pdfData[key];
            delete pdfData[key];
          }
        });
      });
      // 対象月の全メンバーをクリアしてから書き込み
      const ym = `${y}-${String(m).padStart(2,"0")}`;
      MEMBERS.forEach(mem => {
        try { localStorage.removeItem(`shifts:${mem}:${ym}`); } catch {}
      });
      MEMBERS.forEach(mem => {
        if (pdfData[mem]) storage.set(`shifts:${mem}:${ym}`, JSON.stringify(pdfData[mem]));
      });
      setShifts(pdfData[member] || {});
      const all = {};
      MEMBERS.forEach(mem => { if (mem !== member && pdfData[mem]) all[mem] = pdfData[mem]; });
      setAllShifts(all);
      setYear(y); setMonth(m);
      setView("calendar");
      setPdfLoadState("done");
      setTimeout(() => setPdfLoadState(null), 2000);
    } catch(e) {
      console.error(e);
      setPdfLoadState("error");
      setTimeout(() => setPdfLoadState(null), 3000);
    }
  }

  const daysInMonth = new Date(year, month, 0).getDate();
  const firstDow    = new Date(year, month - 1, 1).getDay();

  const stats = (() => {
    let work = 0, off = 0, totalH = 0, hasTime = false;
    for (let d = 1; d <= daysInMonth; d++) {
      const s = shifts[dateKey(year, month, d)];
      if (!s || s.status === "休日") { off++; continue; }
      else { work++; const h = calcHours(s.startTime, s.endTime, s.breakTime ?? 60); if (h) { totalH += h; hasTime = true; } }
    }
    return { work, off, totalH: hasTime ? totalH : null };
  })();

  function openEdit(day, editMember = member) {
    const k = dateKey(year, month, day);
    let src = shifts;
    if (editMember !== member) {
      const ym = `${year}-${String(month).padStart(2,"0")}`;
      try { const r = storage.get(`shifts:${editMember}:${ym}`); src = r ? JSON.parse(r) : {}; } catch { src = {}; }
      setMember(editMember);
    }
    setEditDay(day);
    setEditData(src[k] || { status: "出勤", startTime: "", endTime: "", breakTime: 60, memo: "" });
    setConfirmDelete(false);
  }
  function navEditDay(delta) {
    const d = new Date(year, month - 1, editDay + delta);
    const ny = d.getFullYear(), nm = d.getMonth() + 1, nd = d.getDate();
    const k = dateKey(ny, nm, nd);
    const src = (ny === year && nm === month) ? shifts : (() => {
      try { const r = storage.get(`shifts:${member}:${ny}-${String(nm).padStart(2,"0")}`); return r ? JSON.parse(r) : {}; } catch { return {}; }
    })();
    setYear(ny); setMonth(nm); setEditDay(nd);
    setEditData(src[k] || { status: "出勤", startTime: "", endTime: "", breakTime: 60, memo: "" });
    setConfirmDelete(false);
  }
  function saveEdit() {
    saveShifts({ ...shifts, [dateKey(year, month, editDay)]: { ...editData } });
    setEditDay(null);
  }
  function deleteEntry() {
    const n = { ...shifts };
    delete n[dateKey(year, month, editDay)];
    saveShifts(n);
    setEditDay(null);
    setConfirmDelete(false);
  }
  function toggleSelect(m, day) {
    const key = `${m}:${day}`;
    setSelected(prev => prev.includes(key) ? prev.filter(k => k !== key) : [...prev, key]);
  }
  function deleteSelected() {
    const ym = `${year}-${String(month).padStart(2,"0")}`;
    const byMember = {};
    selected.forEach(key => {
      const idx = key.indexOf(":");
      const m = key.slice(0, idx), d = parseInt(key.slice(idx + 1));
      if (!byMember[m]) byMember[m] = [];
      byMember[m].push(d);
    });
    let newShifts = shifts;
    Object.entries(byMember).forEach(([m, days]) => {
      const sk = `shifts:${m}:${ym}`;
      try {
        const raw = storage.get(sk);
        const s = raw ? JSON.parse(raw) : {};
        days.forEach(d => delete s[dateKey(year, month, d)]);
        storage.set(sk, JSON.stringify(s));
        if (m === member) newShifts = s;
      } catch(e) {}
    });
    setShifts(newShifts);
    const all = {};
    MEMBERS.forEach(m => {
      if (m !== member) { try { const r = storage.get(`shifts:${m}:${ym}`); if (r) all[m] = JSON.parse(r); } catch {} }
    });
    setAllShifts(all);
    setSelected([]);
    setSelectMode(false);
    setConfirmMultiDelete(false);
  }
  function applyPreset(type) {
    const ym = `${year}-${String(month).padStart(2,"0")}`;
    const entry = type === "休"
      ? { status: "休日", startTime: "", endTime: "", breakTime: 60, memo: "" }
      : (() => { const [s, e] = DRAFT_COLORS[type].time.split("-"); return { status: "出勤", startTime: s, endTime: e, breakTime: 60, memo: "" }; })();
    const byMember = {};
    selected.forEach(key => {
      const idx = key.indexOf(":");
      const m = key.slice(0, idx), d = parseInt(key.slice(idx + 1));
      if (!byMember[m]) byMember[m] = [];
      byMember[m].push(d);
    });
    let newShifts = shifts;
    Object.entries(byMember).forEach(([m, days]) => {
      const sk = `shifts:${m}:${ym}`;
      try {
        const raw = storage.get(sk);
        const s = raw ? JSON.parse(raw) : {};
        days.forEach(d => { s[dateKey(year, month, d)] = { ...entry }; });
        storage.set(sk, JSON.stringify(s));
        if (m === member) newShifts = s;
      } catch(e) {}
    });
    setShifts(newShifts);
    const all = {};
    MEMBERS.forEach(m => {
      if (m !== member) { try { const r = storage.get(`shifts:${m}:${ym}`); if (r) all[m] = JSON.parse(r); } catch {} }
    });
    setAllShifts(all);
    setSelected([]);
    setSelectMode(false);
  }
  function swapCells(srcM, srcDay, dstM, dstDay) {
    const ym = `${year}-${String(month).padStart(2,"0")}`;
    const srcKey = dateKey(year, month, srcDay);
    const dstKey = dateKey(year, month, dstDay);
    const ms = new Set([srcM, dstM]);
    const data = {};
    ms.forEach(m => { try { const r = storage.get(`shifts:${m}:${ym}`); data[m] = r ? JSON.parse(r) : {}; } catch { data[m] = {}; } });
    const srcEntry = data[srcM][srcKey];
    const dstEntry = data[dstM][dstKey];
    if (dstEntry) data[srcM][srcKey] = dstEntry; else delete data[srcM][srcKey];
    if (srcEntry) data[dstM][dstKey] = srcEntry; else delete data[dstM][dstKey];
    let newShifts = shifts;
    ms.forEach(m => { storage.set(`shifts:${m}:${ym}`, JSON.stringify(data[m])); if (m === member) newShifts = data[m]; });
    setShifts(newShifts);
    const all = {};
    MEMBERS.forEach(m => { if (m !== member) { try { const r = storage.get(`shifts:${m}:${ym}`); if (r) all[m] = JSON.parse(r); } catch {} } });
    setAllShifts(all);
  }
  function saveMemo(m, day, text) {
    const ym = `${year}-${String(month).padStart(2,"0")}`;
    const k = dateKey(year, month, day);
    const sk = `shifts:${m}:${ym}`;
    try {
      const raw = storage.get(sk);
      const s = raw ? JSON.parse(raw) : {};
      if (!s[k]) s[k] = { status: "出勤", startTime: "", endTime: "", breakTime: 60, memo: "" };
      if (text.trim()) s[k] = { ...s[k], memo: text.trim() };
      else { const { memo, ...rest } = s[k]; s[k] = rest; }
      storage.set(sk, JSON.stringify(s));
      if (m === member) setShifts({ ...s });
      const all = {};
      MEMBERS.forEach(mem => { if (mem !== member) { try { const r = storage.get(`shifts:${mem}:${ym}`); if (r) all[mem] = JSON.parse(r); } catch {} } });
      setAllShifts(all);
    } catch(e) {}
  }
  const prevMonth = () => { setSlideDir("right"); if (month === 1) { setYear(y => y - 1); setMonth(12); } else setMonth(m => m - 1); };
  const nextMonth = () => { setSlideDir("left");  if (month === 12) { setYear(y => y + 1); setMonth(1); } else setMonth(m => m + 1); };
  const goToday   = () => { setSlideDir(null); setYear(today.getFullYear()); setMonth(today.getMonth() + 1); setView("calendar"); };

  const todayY = today.getFullYear();
  const todayM = today.getMonth() + 1;
  const todayD = today.getDate();
  const isCurrentMonth = year === todayY && month === todayM;
  const todayShift = isCurrentMonth ? shifts[dateKey(todayY, todayM, todayD)] : null;

  const labelSm = { fontSize: 9, letterSpacing: 3, color: "#aaa", textTransform: "uppercase", marginBottom: 8, display: "block" };

  return (
    <div className="shift-app">
      {/* ── Header ─────────────────────────────────── */}
      <div style={{ background: "#fff", borderBottom: "1px solid #e0dedd" }} className="safe-top">
        <div style={{ padding: "16px 20px 0" }}>

          {/* Title row */}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 20, position: "relative" }}>
            <div>
              <div style={{ fontSize: 9, letterSpacing: 4, color: "#999", textTransform: "uppercase", marginBottom: 4 }}>Shift Manager</div>
              <button onClick={() => setShowMemberMenu(v => !v)} style={{
                background: "none", border: "none", cursor: "pointer", padding: 0,
                display: "flex", alignItems: "center", gap: 6
              }}>
                <span style={{ fontSize: 22, fontWeight: 300, letterSpacing: 1, color: "#111" }}>{member}</span>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#aaa" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              {showMemberMenu && (
                <div style={{ position: "absolute", top: 56, left: 20, background: "#fff", border: "1px solid #e0dedd", zIndex: 50, minWidth: 100 }}>
                  {MEMBERS.map(m => (
                    <button key={m} onClick={() => { setMember(m); setShowMemberMenu(false); }} style={{
                      display: "block", width: "100%", padding: "10px 16px", background: m === member ? "#f5f4f2" : "#fff",
                      border: "none", cursor: "pointer", textAlign: "left",
                      fontSize: 13, fontWeight: m === member ? 500 : 300, color: "#111", letterSpacing: 0.5
                    }}>{m}</button>
                  ))}
                </div>
              )}
              {/* Today's shift */}
              <div style={{ marginTop: 6, fontSize: 11, color: "#aaa", display: "flex", alignItems: "center", gap: 6 }}>
                <span style={{ fontSize: 9, letterSpacing: 2, textTransform: "uppercase", color: "#ccc" }}>Today</span>
                {todayShift
                  ? todayShift.status === "休日"
                    ? <span style={{ color: "#ccc", letterSpacing: 1 }}>Off</span>
                    : <span style={{ color: "#111", fontWeight: 400 }}>
                        {todayShift.startTime || "—"}{todayShift.endTime ? ` – ${todayShift.endTime}` : ""}
                        {todayShift.memo ? <span style={{ color: "#bbb", fontSize: 10, marginLeft: 6 }}>{todayShift.memo}</span> : null}
                      </span>
                  : <span style={{ color: "#ddd" }}>—</span>
                }
              </div>
              {/* Next day's shift */}
              {(() => {
                const nextDay = new Date(today.getFullYear(), today.getMonth(), today.getDate() + 1);
                const nk = dateKey(nextDay.getFullYear(), nextDay.getMonth() + 1, nextDay.getDate());
                const ns = shifts[nk];
                return (
                  <div style={{ marginTop: 3, fontSize: 11, color: "#aaa", display: "flex", alignItems: "center", gap: 6 }}>
                    <span style={{ fontSize: 9, letterSpacing: 2, textTransform: "uppercase", color: "#ddd" }}>Next</span>
                    {ns
                      ? ns.status === "休日"
                        ? <span style={{ color: "#ddd", letterSpacing: 1 }}>Off</span>
                        : <span style={{ color: "#aaa", fontWeight: 300 }}>
                            {ns.startTime || "—"}{ns.endTime ? ` – ${ns.endTime}` : ""}
                            {ns.memo ? <span style={{ color: "#ccc", fontSize: 10, marginLeft: 6 }}>{ns.memo}</span> : null}
                          </span>
                      : <span style={{ color: "#ddd" }}>—</span>
                    }
                  </div>
                );
              })()}
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 6, alignItems: "flex-end" }}>
              <button
                onClick={() => { if (!pdfLoadState) setShowPdfGuide(true); }}
                disabled={pdfLoadState === "loading"}
                style={{
                  background: pdfLoadState === "done" ? "#2d6a4f" : pdfLoadState === "error" ? "#c0392b" : "none",
                  border: `1px solid ${pdfLoadState === "done" ? "#2d6a4f" : pdfLoadState === "error" ? "#c0392b" : "#888"}`,
                  padding: "5px 10px", cursor: "pointer", fontSize: 9, letterSpacing: 1,
                  color: pdfLoadState ? "#fff" : "#888",
                  transition: "all 0.3s"
                }}>
                {pdfLoadState === "loading" ? "読込中..." : pdfLoadState === "done" ? "完了" : pdfLoadState === "error" ? "取得失敗" : "PDF読込"}
              </button>
              {member === "成田" && Object.values(shifts).some(s => s?.status === "出勤") && (
                <button onClick={() => downloadICS(shifts, member, year, month)} className="icon-btn" style={{
                  display: "flex", alignItems: "center", gap: 6, background: "none",
                  border: "1px solid #888", padding: "6px 12px", cursor: "pointer",
                  fontSize: 10, letterSpacing: 1.5, textTransform: "uppercase", color: "#888"
                }}>
                  iCal
                </button>
              )}
            </div>
          </div>

          {/* Month nav */}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
            <button onClick={prevMonth} className="icon-btn" style={{ background: "none", border: "none", cursor: "pointer", color: "#111", padding: 4 }}><IconChevronL /></button>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span
                onClick={() => {
                  const now = Date.now();
                  if (now - monthLabelLastTap.current < 300) {
                    monthLabelLastTap.current = 0;
                    setYear(todayY); setMonth(todayM);
                    setView("calendar");
                    openEdit(todayD);
                  } else {
                    monthLabelLastTap.current = now;
                  }
                }}
                style={{ fontSize: 13, fontWeight: 400, letterSpacing: 2, textTransform: "uppercase", cursor: "pointer", userSelect: "none" }}
              >{year} / {String(month).padStart(2,"0")}</span>
            </div>
            <button onClick={nextMonth} className="icon-btn" style={{ background: "none", border: "none", cursor: "pointer", color: "#111", padding: 4 }}><IconChevronR /></button>
          </div>

          {/* Stats */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", borderTop: "1px solid #e0dedd" }}>
            {[["WORK", stats.work], ["OFF", stats.off], ["HOURS", stats.totalH !== null ? formatHours(stats.totalH) : "—"]].map(([label, value], i) => (
              <div key={i} style={{ padding: "12px 0", textAlign: "center", borderRight: i < 2 ? "1px solid #e0dedd" : "none" }}>
                <div style={{ fontSize: 8, letterSpacing: 3, color: "#aaa", textTransform: "uppercase", marginBottom: 3 }}>{label}</div>
                <div style={{ fontSize: 17, fontWeight: 300 }}>{value}</div>
              </div>
            ))}
          </div>

          {/* Tabs */}
          <div style={{ display: "flex", borderTop: "1px solid #e0dedd", alignItems: "center" }}>
            {["calendar", "list", "draft", "report"].map(v => {
              const isActive = v === view || (v === "list" && selectMode);
              const label = v === "calendar" ? "Cal" : v === "list" ? (selectMode ? "Select" : "List") : v === "draft" ? "Draft" : "日報";
              return (
                <button key={v} onClick={() => {
                  if (v === "list" && selectMode) { setSelectMode(false); setSelected([]); setConfirmMultiDelete(false); return; }
                  if (v === "list" && view === "list") {
                    const now = Date.now();
                    if (now - listTabLastTap.current < 350) { setSelectMode(true); setSelected([]); listTabLastTap.current = 0; }
                    else { listTabLastTap.current = now; }
                    return;
                  }
                  setView(v); setSelectMode(false); setSelected([]);
                }} style={{
                  flex: 1, padding: "10px 0", background: "none", border: "none", cursor: "pointer",
                  fontSize: 9, letterSpacing: 3, textTransform: "uppercase",
                  color: isActive ? "#111" : "#bbb",
                  borderBottom: isActive ? "1.5px solid #111" : "1.5px solid transparent",
                  transition: "all 0.2s"
                }}>{label}</button>
              );
            })}
          </div>
        </div>
      </div>

      {/* ── Content ────────────────────────────────── */}
      {view === "counter"
        ? <CounterView member={member} year={year} month={month} shifts={shifts} saveShifts={saveShifts} />
        : view === "report"
          ? <DailyReportView year={year} month={month} daysInMonth={daysInMonth} />
          : <div
              key={`${year}-${month}`}
              className={slideDir === "left" ? "slide-in-left" : slideDir === "right" ? "slide-in-right" : ""}
              style={{ paddingBottom: selectMode ? 80 : 20, padding: "20px 16px" }}
              onTouchStart={e => { const t = e.touches[0]; e.currentTarget._tx = t.clientX; e.currentTarget._ty = t.clientY; }}
              onTouchEnd={e => {
                const dx = e.changedTouches[0].clientX - e.currentTarget._tx;
                const dy = e.changedTouches[0].clientY - e.currentTarget._ty;
                if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
                  if (dx < 0) nextMonth(); else prevMonth();
                }
              }}
            >
              {!loaded
                ? <div style={{ textAlign: "center", padding: 60, fontSize: 11, letterSpacing: 2, color: "#bbb", textTransform: "uppercase" }}>Loading</div>
                : view === "calendar"
                  ? <CalendarView year={year} month={month} daysInMonth={daysInMonth} firstDow={firstDow} shifts={shifts} onDayClick={openEdit} allShifts={allShifts} />
                  : view === "list"
                    ? <ListView year={year} month={month} daysInMonth={daysInMonth} shifts={shifts} onDayClick={openEdit} selectMode={selectMode} selected={selected} onToggle={toggleSelect} allShifts={allShifts} member={member} onSwap={swapCells} onSaveMemo={saveMemo} />
                    : <DraftView year={year} month={month} />
              }
            </div>
      }

      {/* ── Multi Delete Bar ───────────────────────── */}
      {selectMode && (
        <div style={{
          position: "fixed", bottom: 0, left: 0, right: 0, zIndex: 150,
          background: "#fff", borderTop: "1px solid #e0dedd",
          padding: "12px 20px 32px", display: "flex", alignItems: "center", gap: 12
        }}>
          {confirmMultiDelete ? (
            <>
              <div style={{ flex: 1, fontSize: 12, color: "#666" }}>{selected.length}件を削除します。よろしいですか？</div>
              <button onClick={() => setConfirmMultiDelete(false)} style={{ padding: "10px 16px", background: "#f5f4f2", border: "none", cursor: "pointer", fontSize: 10, letterSpacing: 2, color: "#666" }}>Cancel</button>
              <button onClick={deleteSelected} style={{ padding: "10px 16px", background: "#c0392b", border: "none", cursor: "pointer", fontSize: 10, letterSpacing: 2, color: "#fff" }}>Delete</button>
            </>
          ) : (
            <>
              <div style={{ fontSize: 11, color: "#aaa", letterSpacing: 1, marginRight: "auto" }}>{selected.length}件選択中</div>
              {["早","中","遅","休"].map(type => {
                const c = DRAFT_COLORS[type];
                return (
                  <button key={type} onClick={() => { if (selected.length > 0) applyPreset(type); }}
                    style={{
                      padding: "8px 14px", border: `1px solid ${c.text}`,
                      background: selected.length > 0 ? c.bg : "#f5f4f2",
                      cursor: selected.length > 0 ? "pointer" : "default",
                      fontSize: 11, fontWeight: 500, color: selected.length > 0 ? c.text : "#ccc",
                      borderRadius: 4, transition: "all 0.15s"
                    }}>{type}</button>
                );
              })}
              <button onClick={() => { if (selected.length > 0) setConfirmMultiDelete(true); }} style={{
                padding: "8px 14px", background: selected.length > 0 ? "#c0392b" : "#e0dedd",
                border: "none", cursor: selected.length > 0 ? "pointer" : "default",
                fontSize: 10, letterSpacing: 2, textTransform: "uppercase", color: "#fff",
                borderRadius: 4, transition: "background 0.2s"
              }}>Del</button>
            </>
          )}
        </div>
      )}

      {/* ── Edit Modal ─────────────────────────────── */}
      {editDay && editData && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", display: "flex", alignItems: "flex-start", justifyContent: "center", zIndex: 100, overflowY: "auto", paddingTop: 70 }}
          onClick={() => { setEditDay(null); setConfirmDelete(false); }}>
          <div
            style={{ background: "#fff", width: "100%", maxWidth: 480, padding: "28px 24px 60px", touchAction: "pan-y", minHeight: "calc(100vh - 70px)" }}
            onClick={e => e.stopPropagation()}
            onTouchStart={e => { modalSwipeX.current = e.touches[0].clientX; }}
            onTouchEnd={e => {
              const dx = e.changedTouches[0].clientX - (modalSwipeX.current ?? e.changedTouches[0].clientX);
              if (Math.abs(dx) > 50) navEditDay(dx < 0 ? 1 : -1);
            }}
          >

            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 24 }}>
              <div>
                <div style={{ fontSize: 9, letterSpacing: 3, color: "#aaa", textTransform: "uppercase", marginBottom: 4 }}>{year} / {String(month).padStart(2,"0")}</div>
                <div style={{ fontSize: 9, letterSpacing: 1, color: "#bbb", marginBottom: 6 }}>{member}</div>

                {editData.status === "出勤" && (

                    <div style={{ display: "flex", border: "1px solid #e0dedd", marginBottom: 6 }}>
                      {[["なし", 0], ["30分", 30], ["45分", 45], ["1時間", 60], ["1.5時間", 90]].map(([label, val], i) => (
                        <button key={val} onClick={() => setEditData(prev => ({ ...prev, breakTime: val }))} style={{
                          flex: 1, padding: "9px 0",

                      <input type="number" min="0" step="5"
                        value={editData.breakTime ?? 60}
                        onChange={e => { const v = parseInt(e.target.value, 10); setEditData(prev => ({ ...prev, breakTime: isNaN(v) ? 0 : v })); }}
                        style={{ flex: 1, border: "none", padding: "7px 10px", fontSize: 11, outline: "none", color: "#555", background: "transparent" }}
                      />

                {editData.status === "出勤" && editData.startTime && editData.endTime && (() => {
                  const h = calcHours(editData.startTime, editData.endTime, editData.breakTime ?? 60);
                  return h ? (
                    <div style={{ display: "flex", alignItems: "center", marginBottom: 20, padding: "10px 12px", background: "#f5f4f2", borderLeft: "2px solid #111" }}>
                      <span style={{ fontSize: 9, letterSpacing: 3, color: "#999", textTransform: "uppercase" }}>実働</span>
                      <span style={{ fontSize: 14, fontWeight: 300, marginLeft: "auto" }}>{formatHours(h)}</span>
                    </div>
                  ) : null;
                })()}

                <div style={{ marginBottom: 24 }}>
                  <label style={labelSm}>Memo</label>
                  <textarea value={editData.memo} onChange={e => setEditData({ ...editData, memo: e.target.value })}
                    onTouchStart={e => e.stopPropagation()} onTouchEnd={e => e.stopPropagation()}
                    placeholder="Add a note..." rows={2}
                    style={{ width: "100%", padding: "10px 12px", border: "1px solid #e0dedd", fontSize: 13, resize: "none", background: "#fafaf9", outline: "none", fontWeight: 300, color: "#333", lineHeight: 1.6 }} />
                </div>

                <button onClick={saveEdit} className="primary-btn" style={{ width: "100%", padding: "13px 0", background: "#111", color: "#fff", border: "none", cursor: "pointer", fontSize: 10, letterSpacing: 3, textTransform: "uppercase" }}>Save</button>
              </>
            )}
          </div>
        </div>
      )}

      {/* PDF読込ガイドモーダル */}
      {showPdfGuide && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 200 }}
          onClick={() => setShowPdfGuide(false)}>
          <div style={{ background: "#fff", width: "100%", maxWidth: 480, padding: "28px 24px 44px" }}
            onClick={e => e.stopPropagation()}>
            <div style={{ fontSize: 9, letterSpacing: 4, color: "#aaa", textTransform: "uppercase", marginBottom: 4 }}>PDF 読込</div>
            <div style={{ fontSize: 20, fontWeight: 300, marginBottom: 20 }}>GitHubアップロード手順</div>

            <a href="https://timecard1.smaregi.jp/shifts/schedule/0/current/2" target="_blank" rel="noopener noreferrer"
              style={{ display: "flex", alignItems: "center", justifyContent: "space-between",
                marginBottom: 16, padding: "10px 14px", background: "#f0f8ff",
                borderLeft: "2px solid #4c7ab5", textDecoration: "none" }}>
              <div>
                <div style={{ fontSize: 9, letterSpacing: 3, textTransform: "uppercase", color: "#4c7ab5", marginBottom: 2 }}>正確なシフト確認</div>
                <div style={{ fontSize: 12, color: "#111" }}>スマレジ・タイムカード</div>
              </div>
              <span style={{ fontSize: 16, color: "#4c7ab5" }}>→</span>

            <div style={{ marginBottom: 20, padding: "10px 14px", background: "#f5f4f2", borderLeft: "2px solid #111" }}>
              <div style={{ fontSize: 9, letterSpacing: 3, textTransform: "uppercase", color: "#999", marginBottom: 6 }}>ファイル名のルール</div>
              <div style={{ fontFamily: "monospace", fontSize: 13, color: "#111" }}>shift_YYYY-MM.pdf</div>
              <div style={{ marginTop: 4, fontSize: 11, color: "#888" }}>例: shift_2026-04.pdf（4月分）</div>
            </div>

            <div style={{ fontSize: 12, color: "#555", lineHeight: 1.9, marginBottom: 20 }}>
              {[
                ["01", "GitHubリポジトリを開く"],
                ["02", "「data」フォルダを開く"],
                ["03", "「Add file」→「Upload files」をタップ"],
                ["04", `shift_${year}-${String(month).padStart(2,"0")}.pdf をアップロード`],
                ["05", "「Commit changes」で確定"],

                cursor: "pointer", fontSize: 10, letterSpacing: 3, textTransform: "uppercase"

      {/* Count フローティングボタン */}

        onClick={() => setView(view === "counter" ? "calendar" : "counter")}
        style={{
          position: "fixed", bottom: 28, right: 20, width: 52, height: 52,
          borderRadius: "50%", border: "none", cursor: "pointer",
          background: view === "counter" ? "#111" : "#fff",
          boxShadow: "0 2px 12px rgba(0,0,0,0.18)",

        }}
      >
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke={view === "counter" ? "#fff" : "#555"}
          strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
