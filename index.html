// ── Daily Report View ────────────────────────────────────────
function DailyReportView({ year, month, daysInMonth }) {
  const today = new Date();
  const todayY = today.getFullYear(), todayM = today.getMonth() + 1, todayD = today.getDate();
  const pad = n => String(n).padStart(2, "0");
  const ym = `${year}-${pad(month)}`;

  const [day, setDay]             = React.useState(() =>
    year === todayY && month === todayM ? todayD : 1
  );
  const [monthTarget, setMonthTarget] = React.useState(null);
  const [editTarget, setEditTarget]   = React.useState(false);
  const [targetInput, setTargetInput] = React.useState("");
  const [report, setReport]           = React.useState(null);
  const [salesMode, setSalesMode]     = React.useState("value");
  const [copied, setCopied]           = React.useState(false);
  const dayScrollRef                  = React.useRef(null);
  const [apiKey, setApiKey]           = React.useState(() => localStorage.getItem("anthropic_api_key") || "");
  const [showApiKey, setShowApiKey]   = React.useState(false);
  const [apiKeyInput, setApiKeyInput] = React.useState("");
  const [isGenerating, setIsGenerating] = React.useState(false);
  const [genError, setGenError]       = React.useState(null);
  const [aiText, setAiText]           = React.useState("");

  const targetKey = `dailyreport:target:${ym}`;
  const dayKey    = d => `dailyreport:${year}-${pad(month)}-${pad(d)}`;

  React.useEffect(() => {
    const init = year === todayY && month === todayM ? todayD : 1;
    setDay(Math.min(init, daysInMonth));
    setEditTarget(false);
  }, [year, month]);

  React.useEffect(() => {
    try { const r = storage.get(targetKey); setMonthTarget(r ? (JSON.parse(r).target ?? null) : null); }
    catch { setMonthTarget(null); }
  }, [year, month]);

  const emptyReport = () => ({ salesAmount: null, salesStatus: null, visitorCount: null, congestionType: null, freeText: "", trainingText: "" });

  React.useEffect(() => {
    try {
      const r = storage.get(dayKey(day));
      if (r) { const d = JSON.parse(r); setReport(d); setSalesMode(d.salesAmount != null ? "value" : "status"); }
      else { setReport(emptyReport()); setSalesMode("value"); }
    } catch { setReport(emptyReport()); }
    setAiText(""); setGenError(null);
  }, [year, month, day]);

  const save = React.useCallback((patch) => {
    setReport(prev => {
      const next = { ...prev, ...patch };
      storage.set(dayKey(day), JSON.stringify(next));
      return next;
    });
  }, [year, month, day]);

  const dotDays = React.useMemo(() => {
    const set = {};
    for (let d = 1; d <= daysInMonth; d++) {
      try {
        const r = storage.get(dayKey(d));
        if (r) { const o = JSON.parse(r); set[d] = !!(o.salesAmount != null || o.salesStatus || o.visitorCount || o.freeText || o.trainingText); }
      } catch {}
    }
    return set;
  }, [year, month, daysInMonth, report]);

  React.useLayoutEffect(() => {
    const el = dayScrollRef.current;
    if (!el) return;
    const itemW = 36; // 34px button + 2px gap
    el.scrollLeft = Math.max(0, (day - 1) * itemW - el.offsetWidth / 2 + itemW / 2);
  }, [year, month, !!report]);

  if (!report) return null;

  const fmtYen  = n => n != null ? `¥${Number(n).toLocaleString()}` : "—";
  const progress = monthTarget && report.salesAmount != null ? Math.round(report.salesAmount / monthTarget * 100) : null;
  const WDAY = ["日","月","火","水","木","金","土"];

  const buildSummary = () => {
    if (!report) return "";
    const dw = new Date(year, month - 1, day).getDay();
    const lines = [`【日報】${year}年${month}月${day}日（${WDAY[dw]}）`];
    if (report.salesAmount != null) {
      const p = monthTarget ? ` / 目標比${Math.round(report.salesAmount / monthTarget * 100)}%` : "";
      lines.push(`売上: ${fmtYen(report.salesAmount)}${p}`);
    } else if (report.salesStatus) {
      lines.push(`売上: ${report.salesStatus === "achieved" ? "目標達成" : "目標未達成"}`);
    }
    if (report.visitorCount) {
      const vl = { many: "多", medium: "中", few: "少" }[report.visitorCount];
      const cl = report.congestionType === "all_day" ? "終日混雑" : report.congestionType === "temporary" ? "一時的に混雑" : null;
      lines.push(`来客: ${vl}${cl ? `（${cl}）` : ""}`);
    }
    if (report.freeText?.trim()) lines.push(`備考: ${report.freeText.trim()}`);
    if (report.trainingText?.trim()) lines.push(`研修: ${report.trainingText.trim()}`);
    return lines.join("\n");
  };

  const handleCopy = () => {
    const text = aiText || buildSummary();
    if (!text) return;
    navigator.clipboard?.writeText(text).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 1800);
    });
  };

  const generateReport = async () => {
    if (!apiKey) { setShowApiKey(true); setApiKeyInput(""); return; }
    const dw = new Date(year, month - 1, day).getDay();
    const parts = [];
    if (report.salesAmount != null) parts.push(`純売上: ¥${Number(report.salesAmount).toLocaleString()}`);
    else if (report.salesStatus) parts.push(`売上状況: ${report.salesStatus === "achieved" ? "目標達成" : "目標未達成"}`);
    if (report.visitorCount) {
      const vl = { many: "多", medium: "中", few: "少" }[report.visitorCount];
      const cl = report.congestionType === "all_day" ? "終日混雑" : report.congestionType === "temporary" ? "一時的に混雑" : null;
      parts.push(`来店者数: ${vl}${cl ? `（${cl}）` : ""}`);
    }
    if (report.freeText?.trim()) parts.push(report.freeText.trim());
    if (report.trainingText?.trim()) parts.push(`研修・申し送り: ${report.trainingText.trim()}`);
    if (!parts.length) return;

    const inputText = `${year}年${month}月${day}日（${WDAY[dw]}）\n${parts.join("\n")}`;
    setIsGenerating(true); setGenError(null);
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({
          model: "claude-haiku-4-5",
          max_tokens: 1024,
          system: `あなたは小売店舗スタッフの日報作成を補助するアシスタントです。
スタッフから提供されるメモや箇条書きの情報を、丁寧でプロフェッショナルな日本語のビジネス文章（日報）に変換してください。以下のスタイルで作成してください：
- です・ます調の丁寧な敬語表現
- 一日を振り返る報告体（「〜の一日となりました」「〜となりました」等）
- 売上情報・来客状況・気づき・研修内容を自然な流れでまとめる
- 前向きで建設的なトーン
- 150〜250文字程度にまとめる
- 本文のみを出力（ヘッダーや日付・【】等の記号は不要）`,
          messages: [{ role: "user", content: inputText }]
        })
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || `APIエラー ${res.status}`);
      }
      const data = await res.json();
      const body = data.content?.[0]?.text || "";
      const dateHeader = `【日報】${year}年${month}月${day}日（${WDAY[dw]}）`;
      setAiText(`${dateHeader}\n${body}`);
    } catch (e) {
      setGenError(e.message);
    } finally {
      setIsGenerating(false);
    }
  };

  const SectionLabel = ({ label }) => (
    <div style={{ fontSize: 9, letterSpacing: 2, color: "#aaa", textTransform: "uppercase", marginBottom: 10 }}>{label}</div>
  );
  const ChoiceBtn = ({ active, color = "#111", bgActive = "#111", textActive = "#fff", onClick, children, style = {} }) => (
    <button onClick={onClick} style={{
      flex: 1, padding: "9px 0", border: `1.5px solid ${active ? color : "#e0e0e0"}`,
      borderRadius: 8, background: active ? bgActive : "transparent",
      color: active ? textActive : "#aaa", fontSize: 12, cursor: "pointer", ...style
    }}>{children}</button>
  );

  return (
    <div style={{ background: "#fff", minHeight: "100vh", paddingBottom: 80 }}>

      {/* 月間日割り目標 */}
      <div style={{ padding: "16px 16px 0" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
          <SectionLabel label="月間日割り目標" />
          {!editTarget && (
            <button onClick={() => { setEditTarget(true); setTargetInput(monthTarget != null ? String(monthTarget) : ""); }}
              style={{ background: "none", border: "none", cursor: "pointer", fontSize: 10, color: "#bbb", letterSpacing: 1 }}>
              編集
            </button>
          )}
        </div>
        {editTarget ? (
          <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 14 }}>
            <span style={{ fontSize: 14, color: "#555" }}>¥</span>
            <input type="number" value={targetInput} onChange={e => setTargetInput(e.target.value)}
              placeholder="例: 50000" autoFocus
              style={{ flex: 1, border: "none", borderBottom: "1.5px solid #111", fontSize: 20, padding: "4px 0", outline: "none" }} />
            <button onClick={() => {
              const num = parseInt(targetInput.replace(/,/g, ""), 10);
              const val = isNaN(num) ? null : num;
              setMonthTarget(val);
              storage.set(targetKey, JSON.stringify({ target: val }));
              setEditTarget(false);
            }} style={{ background: "#111", color: "#fff", border: "none", borderRadius: 6, padding: "6px 14px", fontSize: 11, cursor: "pointer" }}>保存</button>
            <button onClick={() => setEditTarget(false)}
              style={{ background: "none", border: "none", cursor: "pointer", fontSize: 11, color: "#999" }}>取消</button>
          </div>
        ) : (
          <div style={{ fontSize: 22, fontWeight: 300, letterSpacing: 1, marginBottom: 14 }}>
            {monthTarget != null ? fmtYen(monthTarget) : <span style={{ color: "#ccc", fontSize: 13 }}>未設定</span>}
          </div>
        )}
        <div style={{ height: 1, background: "#f0f0ee" }} />
      </div>

      {/* 日付セレクター */}
      <div ref={dayScrollRef} style={{ overflowX: "auto", padding: "10px 16px 6px", display: "flex", gap: 2, scrollbarWidth: "none" }}>
        {Array.from({ length: daysInMonth }, (_, i) => i + 1).map(d => {
          const dw = new Date(year, month - 1, d).getDay();
          const isSelected = d === day;
          const isToday = year === todayY && month === todayM && d === todayD;
          return (
            <button key={d} onClick={() => setDay(d)} style={{
              minWidth: 34, height: 50, flexShrink: 0, border: "none", borderRadius: 8, cursor: "pointer",
              background: isSelected ? "#111" : "transparent",
              display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 2
            }}>
              <span style={{ fontSize: 7, color: isSelected ? "#777" : dw === 0 ? "#e74c3c" : dw === 6 ? "#888" : "#bbb" }}>{WDAY[dw]}</span>
              <span style={{ fontSize: 13, fontWeight: isToday ? 600 : 300, color: isSelected ? "#fff" : "#111" }}>{d}</span>
              <div style={{ width: 4, height: 4, borderRadius: "50%", background: dotDays[d] ? (isSelected ? "#fff" : "#111") : "transparent" }} />
            </button>
          );
        })}
      </div>
      <div style={{ height: 1, background: "#f0f0ee", margin: "0 16px 16px" }} />

      {/* フォーム */}
      <div style={{ padding: "0 16px" }}>

        {/* 純売上 */}
        <div style={{ marginBottom: 22 }}>
          <SectionLabel label="純売上" />
          <div style={{ display: "flex", gap: 4, marginBottom: 12 }}>
            {[["value", "数値入力"], ["status", "達成 / 未達成"]].map(([mode, label]) => (
              <button key={mode} onClick={() => {
                setSalesMode(mode);
                if (mode === "value") save({ salesStatus: null });
                else save({ salesAmount: null });
              }} style={{
                flex: 1, padding: "6px 0", border: "1px solid",
                borderColor: salesMode === mode ? "#111" : "#e0e0e0",
                borderRadius: 6, background: salesMode === mode ? "#111" : "transparent",
                color: salesMode === mode ? "#fff" : "#aaa", fontSize: 10, cursor: "pointer"
              }}>{label}</button>
            ))}
          </div>
          {salesMode === "value" ? (
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 16, color: "#555" }}>¥</span>
              <input type="number" value={report.salesAmount ?? ""} placeholder="0"
                onChange={e => { const v = e.target.value === "" ? null : parseInt(e.target.value, 10); save({ salesAmount: isNaN(v) ? null : v }); }}
                style={{ flex: 1, border: "none", borderBottom: "1.5px solid #e0e0e0", fontSize: 22, padding: "4px 0", outline: "none" }} />
            </div>
          ) : (
            <div style={{ display: "flex", gap: 8 }}>
              <ChoiceBtn active={report.salesStatus === "achieved"} color="#27ae60" bgActive="#27ae60"
                onClick={() => save({ salesStatus: report.salesStatus === "achieved" ? null : "achieved" })}>達成</ChoiceBtn>
              <ChoiceBtn active={report.salesStatus === "not_achieved"} color="#e74c3c" bgActive="#e74c3c"
                onClick={() => save({ salesStatus: report.salesStatus === "not_achieved" ? null : "not_achieved" })}>未達成</ChoiceBtn>
            </div>
          )}
          {progress != null && (
            <div style={{ marginTop: 10 }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 9, color: "#aaa", marginBottom: 4 }}>
                <span>目標比</span><span style={{ color: progress >= 100 ? "#27ae60" : "#c9a84c" }}>{progress}%</span>
              </div>
              <div style={{ height: 3, background: "#f0f0ee", borderRadius: 2, overflow: "hidden" }}>
                <div style={{ height: "100%", width: `${Math.min(progress, 100)}%`, background: progress >= 100 ? "#27ae60" : "#c9a84c", borderRadius: 2, transition: "width 0.3s" }} />
              </div>
            </div>
          )}
        </div>

        {/* 来店者数 */}
        <div style={{ marginBottom: 22 }}>
          <SectionLabel label="来店者数" />
          <div style={{ display: "flex", gap: 8, marginBottom: report.visitorCount ? 10 : 0 }}>
            {[["many", "多"], ["medium", "中"], ["few", "少"]].map(([val, label]) => (
              <ChoiceBtn key={val} active={report.visitorCount === val}
                onClick={() => save({ visitorCount: report.visitorCount === val ? null : val, congestionType: report.visitorCount === val ? null : report.congestionType })}>
                {label}
              </ChoiceBtn>
            ))}
          </div>
          {report.visitorCount && (
            <div style={{ display: "flex", gap: 8 }}>
              {[["all_day", "終日混雑"], ["temporary", "一時的に混雑"]].map(([val, label]) => (
                <ChoiceBtn key={val} active={report.congestionType === val}
                  color="#4c7ab5" bgActive="#eef6ff" textActive="#4c7ab5"
                  onClick={() => save({ congestionType: report.congestionType === val ? null : val })}>
                  {label}
                </ChoiceBtn>
              ))}
            </div>
          )}
        </div>

        {/* 自由入力 */}
        <div style={{ marginBottom: 22 }}>
          <SectionLabel label="自由入力" />
          <textarea value={report.freeText} rows={3}
            onChange={e => save({ freeText: e.target.value })}
            placeholder="今日の状況・特記事項など"
            style={{ width: "100%", border: "1px solid #e0e0e0", borderRadius: 8, padding: "10px 12px", fontSize: 13, outline: "none", resize: "none", boxSizing: "border-box", fontFamily: "inherit", color: "#111" }} />
        </div>

        {/* 研修 */}
        <div style={{ marginBottom: 22 }}>
          <SectionLabel label="研修" />
          <textarea value={report.trainingText} rows={3}
            onChange={e => save({ trainingText: e.target.value })}
            placeholder="研修内容・申し送り事項など"
            style={{ width: "100%", border: "1px solid #e0e0e0", borderRadius: 8, padding: "10px 12px", fontSize: 13, outline: "none", resize: "none", boxSizing: "border-box", fontFamily: "inherit", color: "#111" }} />
        </div>

        {/* まとめテキスト */}
        {(() => {
          const summary = buildSummary();
          const hasStructured = summary.split("\n").length > 1;
          const displayText = aiText || (hasStructured ? summary : "");
          const hasContent = !!displayText;
          const hasInput = hasStructured;
          return (
            <div style={{ marginBottom: 32 }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
                <SectionLabel label="まとめテキスト" />
                <div style={{ display: "flex", gap: 6 }}>
                  <button onClick={generateReport} disabled={isGenerating || !hasInput}
                    style={{
                      padding: "5px 14px", border: "none", borderRadius: 6,
                      cursor: (isGenerating || !hasInput) ? "default" : "pointer",
                      background: isGenerating ? "#ccc" : hasInput ? "#4c7ab5" : "#e0e0e0",
                      color: "#fff", fontSize: 10, letterSpacing: 0.5, transition: "background 0.2s",
                      display: "flex", alignItems: "center", gap: 5
                    }}>
                    {isGenerating ? (
                      <><span style={{ display: "inline-block", width: 10, height: 10, border: "2px solid rgba(255,255,255,0.4)", borderTopColor: "#fff", borderRadius: "50%", animation: "spin 0.7s linear infinite" }} />生成中…</>
                    ) : "AI日報"}
                  </button>
                  <button onClick={handleCopy} disabled={!hasContent}
                    style={{
                      padding: "5px 14px", border: "none", borderRadius: 6, cursor: hasContent ? "pointer" : "default",
                      background: copied ? "#27ae60" : hasContent ? "#111" : "#e0e0e0",
                      color: "#fff", fontSize: 10, letterSpacing: 1, transition: "background 0.2s"
                    }}>
                    {copied ? "コピー済" : "コピー"}
                  </button>
                </div>
              </div>
              {genError && (
                <div style={{ marginBottom: 8, padding: "8px 12px", background: "#fff5f5", border: "1px solid #fcc", borderRadius: 6, fontSize: 11, color: "#c0392b" }}>
                  {genError}
                </div>
              )}
              <div style={{
                background: aiText ? "#f0f6ff" : "#f8f8f8", borderRadius: 8, padding: "12px 14px",
                fontSize: 13, lineHeight: 1.8, color: hasContent ? "#111" : "#bbb",
                whiteSpace: "pre-wrap", minHeight: 80, letterSpacing: 0.3,
                border: aiText ? "1px solid #d0e4f7" : "none"
              }}>
                {hasContent ? displayText : "入力内容がありません"}
              </div>
              {aiText && (
                <button onClick={() => setAiText("")}
                  style={{ marginTop: 6, background: "none", border: "none", cursor: "pointer", fontSize: 10, color: "#bbb", letterSpacing: 0.5 }}>
                  AIテキストをクリア
                </button>
              )}
              {/* API Key 設定 */}
              <div style={{ marginTop: 16 }}>
                <button onClick={() => { setShowApiKey(v => !v); setApiKeyInput(apiKey); }}
                  style={{ background: "none", border: "none", cursor: "pointer", fontSize: 10, color: "#ccc", letterSpacing: 0.5 }}>
                  {showApiKey ? "▲ APIキー設定を閉じる" : `▼ APIキー設定${apiKey ? "（設定済）" : "（未設定）"}`}
                </button>
                {showApiKey && (
                  <div style={{ marginTop: 8, display: "flex", gap: 8, alignItems: "center" }}>
                    <input type="password" value={apiKeyInput} onChange={e => setApiKeyInput(e.target.value)}
                      placeholder="sk-ant-..." autoComplete="off"
                      style={{ flex: 1, border: "1px solid #e0e0e0", borderRadius: 6, padding: "6px 10px", fontSize: 12, outline: "none", fontFamily: "monospace" }} />
                    <button onClick={() => {
                      localStorage.setItem("anthropic_api_key", apiKeyInput);
                      setApiKey(apiKeyInput);
                      setShowApiKey(false);
                    }} style={{ background: "#111", color: "#fff", border: "none", borderRadius: 6, padding: "6px 12px", fontSize: 11, cursor: "pointer" }}>保存</button>
                    {apiKey && <button onClick={() => {
                      localStorage.removeItem("anthropic_api_key");
                      setApiKey(""); setApiKeyInput(""); setShowApiKey(false);
                    }} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 11, color: "#e74c3c" }}>削除</button>}
                  </div>
                )}
              </div>
            </div>
          );
        })()}

      </div>
    </div>
  );
}

// ── Calendar View ────────────────────────────────────────────
function CalendarView({ year, month, daysInMonth, firstDow, shifts, onDayClick, allShifts = {} }) {
  const today = new Date();
  const todayY = today.getFullYear();
  const todayM = today.getMonth() + 1;
  const todayD = today.getDate();

  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);

  return (
    <div style={{ background: "#fff", padding: "16px 12px" }}>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", marginBottom: 8 }}>
        {WEEKDAY_JP.map((d, i) => (
          <div key={d} style={{ textAlign: "center", fontSize: 9, letterSpacing: 2, textTransform: "uppercase", color: i === 0 ? "#c0392b" : i === 6 ? "#555" : "#bbb", padding: "4px 0" }}>{d}</div>
        ))}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 2 }}>
        {cells.map((day, i) => {
          if (!day) return <div key={i} />;
          const dow = (firstDow + day - 1) % 7;
          const k = dateKey(year, month, day);
          const data = shifts[k];
          const isOff = !data || data.status === "休日";
          const isToday = year === todayY && month === todayM && day === todayD;
          const shiftMins = (!isOff && data?.startTime) ? (() => { const [h,m] = data.startTime.split(":").map(Number); return h*60+m; })() : null;
          const endMins   = (!isOff && data?.endTime)   ? (() => { const [h,m] = data.endTime.split(":").map(Number);   return h*60+m; })() : null;
          const isLate      = endMins !== null ? endMins >= 20 * 60 + 30 : shiftMins !== null && shiftMins >= 11 * 60;
          const isEarly     = !isLate && shiftMins !== null && shiftMins < 10 * 60;
          const isLate2P    = isLate && shiftMins === 11 * 60;
          const isMid       = shiftMins !== null && !isEarly && !isLate;
          const barColor = isOff ? "#ddd" : isEarly ? "#c9a84c" : isLate2P ? "#1d7a6e" : isLate ? "#2d6a4f" : isMid ? "#4c7ab5" : data ? "#888" : "#eee";
          // 同じ日に出勤している他メンバー
          const sameDay = Object.entries(allShifts)
            .filter(([, ms]) => ms[k]?.status === "出勤")
            .map(([name]) => name.slice(0, 1)); // 苗字1文字
          return (
            <button key={i} onClick={() => onDayClick(day)} className="cal-day" style={{
              border: "none", padding: "8px 4px 8px", cursor: "pointer",
              background: isToday ? "#111" : !data ? "transparent" : isOff ? "#f5f4f2" : "#fff",
              display: "flex", flexDirection: "column", alignItems: "center", gap: 3, minHeight: 60,
              borderTop: `2px solid ${barColor}`,
              outline: "none", transition: "background 0.15s", position: "relative"
            }}>
              <span style={{
                fontSize: 13, fontWeight: isToday ? 600 : 300,
                color: isToday ? "#fff" : !data ? "#ccc" : isOff ? "#ccc" : dow === 0 ? "#c0392b" : "#111"
              }}>{day}</span>
              {data && !isOff && <span style={{ fontSize: 10, color: isToday ? "#aaa" : "#888", fontWeight: 300 }}>{data.startTime}</span>}
              {isToday && data && !isOff && (
                <span style={{ width: 5, height: 5, borderRadius: "50%", background: barColor, flexShrink: 0 }} />
              )}
              {isOff && <span style={{ fontSize: 8, letterSpacing: 1.5, color: isToday ? "#555" : "#ccc", textTransform: "uppercase" }}>Off</span>}
              {data?.memo && !isOff && <span style={{ width: 3, height: 3, background: isToday ? "#fff" : "#111", borderRadius: "50%" }} />}
              {!isOff && sameDay.length > 0 && (
                <div style={{ display: "flex", gap: 2, flexWrap: "wrap", justifyContent: "center" }}>
                  {sameDay.map(n => (
                    <span key={n} style={{ fontSize: 7, color: isToday ? "#777" : "#aaa", letterSpacing: 0.5 }}>{n}</span>
                  ))}
                </div>
              )}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ── List View ────────────────────────────────────────────────
function ListView({ year, month, daysInMonth, shifts, onDayClick, selectMode, selected, onToggle, allShifts = {}, member, onSwap, onSaveMemo }) {
  const today = new Date();
  const todayD2 = today.getDate(), todayM2 = today.getMonth() + 1, todayY2 = today.getFullYear();
  const dragRef = React.useRef({ source: null });
  const [dragSrc, setDragSrc] = React.useState(null);
  const [dragTarget, setDragTarget] = React.useState(null);
  const cellDblTapRef = React.useRef({ m: null, day: null, t: 0 });
  const listContainerRef = React.useRef(null);
  const [memoPreview, setMemoPreview] = React.useState(null); // { day, items }
  const [memoEditing, setMemoEditing] = React.useState(null); // { m, text }
  const [memoCompose, setMemoCompose] = React.useState(null); // { day, text, targetM }
  const memoCellDblTap = React.useRef({ day: null, t: 0 });

  // non-passive touchmove: prevent page scroll while dragging
  React.useEffect(() => {
    const el = listContainerRef.current;
    if (!el) return;
    const handler = e => { if (dragRef.current.source) e.preventDefault(); };
    el.addEventListener('touchmove', handler, { passive: false });
    return () => el.removeEventListener('touchmove', handler);
  }, []);

  const allData = {};
  MEMBERS.forEach(m => { allData[m] = m === member ? shifts : (allShifts[m] || {}); });

  const shiftType = data => {
    if (!data || data.status !== "出勤" || !data.startTime) return null;
    const [sh, sm] = data.startTime.split(":").map(Number);
    const startMins = sh * 60 + sm;
    if (data.endTime) {
      const [eh, em] = data.endTime.split(":").map(Number);
      const endMins = eh * 60 + em;
      if (endMins >= 20 * 60 + 30) return "遅";
    }
    return startMins < 10 * 60 ? "早" : "中";
  };

  return (
    <div ref={listContainerRef} style={{ background: "#fff", paddingBottom: 80 }}>
      {/* Sticky header */}
      <div style={{
        display: "grid", gridTemplateColumns: `40px repeat(${MEMBERS.length}, 1fr) 24px`,
        borderBottom: "2px solid #e0dedd", background: "#fafaf9",
        position: "sticky", top: 0, zIndex: 9
      }}>
        <div />
        {MEMBERS.map(m => (
          <div key={m} style={{
            padding: "7px 2px", fontSize: 9, textAlign: "center",
            borderLeft: "1px solid #e0dedd",
            color: m === member ? "#111" : "#aaa",
            fontWeight: m === member ? 600 : 400,
            borderBottom: m === member ? "2px solid #111" : "2px solid transparent",
            marginBottom: -2
          }}>{m}</div>
        ))}
        <div style={{ borderLeft: "1px solid #e0dedd" }} />
      </div>

      {/* Rows */}
      {Array.from({ length: daysInMonth }, (_, i) => i + 1).map(day => {
        const dow = new Date(year, month - 1, day).getDay();
        const isToday = day === todayD2 && month === todayM2 && year === todayY2;
        const isSun = dow === 0, isSat = dow === 6;
        const k = dateKey(year, month, day);
        const memo = allData[member]?.[k]?.memo;
        return (
          <div key={day} style={{
            display: "grid", gridTemplateColumns: `40px repeat(${MEMBERS.length}, 1fr) 24px`,
            borderBottom: "1px solid #f0f0ee"
          }}>
            {/* Date cell */}
            <div style={{
              padding: "6px 4px", display: "flex", flexDirection: "column",
              alignItems: "center", justifyContent: "center",
              background: isToday ? "#111" : "transparent"
            }}>
              <span style={{ fontSize: 13, fontWeight: 300, color: isToday ? "#fff" : isSun ? "#c0392b" : isSat ? "#555" : "#111" }}>{day}</span>
              <span style={{ fontSize: 8, letterSpacing: 1, color: isToday ? "#777" : isSun ? "#c0392b" : "#bbb" }}>{WEEKDAY_JP[dow]}</span>
            </div>

            {/* Member cells */}
            {MEMBERS.map(m => {
              const data = allData[m]?.[k];
              const isOff = !data || data.status === "休日";
              const type = shiftType(data);
              const colKey = type === "遅" && data?.startTime === "11:00" ? "遅2" : type;
              const col = DRAFT_COLORS[colKey];
              const cellKey = `${m}:${day}`;
              const isCellSelected = selectMode && selected?.includes(cellKey);

              const cellBg = isCellSelected ? "#ebebea"
                : type ? col.bg : isOff ? "#f8f7f6" : "#fff";

              const isDragSrc = dragSrc?.m === m && dragSrc?.day === day;
              const isDragTgt = dragTarget?.m === m && dragTarget?.day === day;
              return (
                <button key={m}
                  data-m={m} data-day={String(day)}
                  onClick={() => {
                    if (selectMode) { onToggle(m, day); return; }
                    const now = Date.now();
                    const last = cellDblTapRef.current;
                    if (last.m === m && last.day === day && now - last.t < 350) {
                      cellDblTapRef.current = { m: null, day: null, t: 0 };
                      onDayClick(day, m);
                    } else {
                      cellDblTapRef.current = { m, day, t: now };
                    }
                  }}
                  onTouchStart={e => {
                    if (selectMode) return;
                    e.stopPropagation();
                    const t = e.touches[0];
                    dragRef.current.startX = t.clientX;
                    dragRef.current.startY = t.clientY;
                    dragRef.current.timer = setTimeout(() => {
                      dragRef.current.timer = null;
                      dragRef.current.source = { m, day };
                      setDragSrc({ m, day });
                      if (navigator.vibrate) navigator.vibrate(40);
                    }, 400);
                  }}
                  onTouchMove={e => {
                    if (selectMode) return;
                    // 指が動きすぎたら長押しキャンセル
                    if (dragRef.current.timer) {
                      const t = e.touches[0];
                      const dx = t.clientX - dragRef.current.startX;
                      const dy = t.clientY - dragRef.current.startY;
                      if (dx * dx + dy * dy > 100) {
                        clearTimeout(dragRef.current.timer);
                        dragRef.current.timer = null;
                      }
                      return;
                    }
                    if (!dragRef.current.source) return;
                    const touch = e.touches[0];
                    const el = document.elementFromPoint(touch.clientX, touch.clientY);
                    const btn = el?.closest('[data-m][data-day]');
                    if (btn) {
                      const tm = btn.dataset.m, td = parseInt(btn.dataset.day);
                      if (dragTarget?.m !== tm || dragTarget?.day !== td) setDragTarget({ m: tm, day: td });
                    }
                  }}
                  onTouchEnd={e => {
                    if (dragRef.current.timer) {
                      clearTimeout(dragRef.current.timer);
                      dragRef.current.timer = null;
                    }
                    const src = dragRef.current.source;
                    dragRef.current.source = null;
                    setDragSrc(null); setDragTarget(null);
                    e.stopPropagation(); // 常に月スワイプへの伝播を防ぐ
                    if (!src) return;
                    const touch = e.changedTouches[0];
                    const el = document.elementFromPoint(touch.clientX, touch.clientY);
                    const btn = el?.closest('[data-m][data-day]');
                    if (btn) {
                      const tm = btn.dataset.m, td = parseInt(btn.dataset.day);
                      if (!(src.m === tm && src.day === td)) { onSwap(src.m, src.day, tm, td); }
                    }
                  }}
                  style={{
                    border: "none", borderLeft: "1px solid #f0f0ee", minHeight: 44,
                    background: isDragTgt ? "#e8f0fe" : cellBg, cursor: "pointer",
                    display: "flex", flexDirection: "column", alignItems: "center",
                    justifyContent: "center", gap: 1, padding: "4px 2px",
                    borderTop: isDragTgt ? "2px solid #4c7ab5" : isCellSelected ? "2px solid #999" : type ? `2px solid ${col.text}` : "2px solid transparent",
                    position: "relative", opacity: isDragSrc ? 0.35 : 1,
                    transition: "opacity 0.1s",
                    userSelect: "none", WebkitUserSelect: "none"
                  }}
                  onContextMenu={e => e.preventDefault()}>
                  {isCellSelected && (
                    <div style={{
                      position: "absolute", top: 3, right: 3,
                      width: 10, height: 10, borderRadius: "50%",
                      background: "#999",
                      display: "flex", alignItems: "center", justifyContent: "center"
                    }}>
                      <svg width="6" height="6" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                    </div>
                  )}
                  {type ? (
                    <>
                      <span style={{ fontSize: 11, fontWeight: 500, color: isCellSelected ? "#888" : col.text }}>{type}</span>
                      <span style={{ fontSize: 7, color: isCellSelected ? "#888" : col.text, opacity: 0.8, lineHeight: 1 }}>{data.startTime}</span>
                    </>
                  ) : (
                    <span style={{ fontSize: 9, letterSpacing: 1, color: "#ccc" }}>休</span>
                  )}
                </button>
              );
            })}

            {/* Memo cell */}
            {(() => {
              const memoItems = MEMBERS.map(m => {
                const d = allData[m]?.[k];
                const t = shiftType(d);
                const dotColor = t ? DRAFT_COLORS[t].text : "#bbb";
                return d?.memo ? { m, text: d.memo, color: dotColor } : null;
              }).filter(Boolean);
              const isOpen = memoPreview?.day === day;
              return (
                <button
                  onTouchStart={e => e.stopPropagation()}
                  onTouchEnd={e => e.stopPropagation()}
                  onClick={() => {
                    const now = Date.now();
                    const last = memoCellDblTap.current;
                    if (last.day === day && now - last.t < 350) {
                      memoCellDblTap.current = { day: null, t: 0 };
                      setMemoPreview(null);
                      setMemoCompose({ day, text: "", targetM: null });
                    } else {
                      memoCellDblTap.current = { day, t: now };
                      if (memoItems.length) setMemoPreview(p => p?.day === day ? null : { day, items: memoItems });
                    }
                  }}
                  style={{
                    border: "none", borderLeft: "1px solid #f0f0ee", background: "transparent",
                    display: "flex", alignItems: "center", justifyContent: "center",
                    cursor: "pointer", minHeight: 44, padding: 0
                  }}>
                  {memoItems.length > 0 && (
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 2 }}>
                      {MEMBERS.map(m => {

// ── Draft View (翌月シフト仮組み) ────────────────────────────
const DRAFT_TYPES  = [null, "早", "中", "遅", "休"];
const DRAFT_COLORS = {
  "早":  { bg: "#fffbee", text: "#c9a84c", time: "9:30-18:30" },
  "中":  { bg: "#eef6ff", text: "#4c7ab5", time: "10:30-19:30" },
  "遅":  { bg: "#efffef", text: "#2d6a4f", time: "11:30-20:30" },
  "遅2": { bg: "#eafcf8", text: "#1d7a6e", time: "11:00-20:30" }, // 2人体制
  "休":  { bg: "#f5f4f2", text: "#bbb",    time: "" },
};
const DRAFT_H_PER_DAY = 8;   // 9時間 − 1時間休憩
const DRAFT_MAX_H     = 190; // 残業10h上限

// ── Auto-schedule algorithm ───────────────────────────────────
function buildAutoSchedule(year, month, reqOff, busyDays, targetHours, maxConsecutive, ratios = {}, training = {}, memberDays = {}) {
  const dim = new Date(year, month, 0).getDate();
  const globalTargetDays = Math.round(targetHours / DRAFT_H_PER_DAY);
  const tgtDays = m => memberDays[m] ?? globalTargetDays;
  const busySet = new Set(busyDays || []);
  const TYPES = ["早", "中", "遅"];
  const MIN_STAFF = 2;
  const MAX_STAFF = 3;

  // work[member][day]: true=出勤 false=休 undefined=未決定
  const work = {};
  MEMBERS.forEach(m => {
    work[m] = {};
    (reqOff[m] || []).forEach(d => { work[m][d] = false; }); // 希望休は確定
  });

  const workCount  = m => Object.values(work[m]).filter(Boolean).length;
  const dayWorkers = d => MEMBERS.filter(m => work[m][d] === true).length;
  const streak = (m, d) => {
    let s = 0;
    for (let i = d - 1; i >= 1; i--) {
      if (work[m][i] === true) s++; else break;
    }
    return s;
  };
  const typeCnt = {};
  MEMBERS.forEach(m => { typeCnt[m] = { "早": 0, "中": 0, "遅": 0 }; });

  // 比率を考慮したdeficit計算: target比率 - 実績比率 が最大の番種を優先
  const isBlocked  = (m, t) => (ratios[m]?.[t] ?? 3) === 0; // 比率0 = 絶対割り当て不可
  const typeDeficit = (m, t) => {
    const r = ratios[m] || {};
    const w = t => r[t] ?? 3;
    const totalW = TYPES.reduce((s, x) => s + w(x), 0);
    const totalT = TYPES.reduce((s, x) => s + typeCnt[m][x], 0) || 1;
    return w(t) / totalW - typeCnt[m][t] / totalT;
  };
  const bestType = (m, exclude = []) => {
    // まず比率0以外から選ぶ、全て0(またはexclude済み)の場合はexcludeのみで再選択(カバレッジ優先)
    const avail = TYPES.filter(t => !exclude.includes(t));
    const allowed = avail.filter(t => !isBlocked(m, t));
    const pool = allowed.length > 0 ? allowed : avail;
    return pool.sort((a, b) => typeDeficit(m, b) - typeDeficit(m, a))[0] || "早";
  };

  // Phase 1: 繁忙日 → 最低3人確保、ただし目標時間を優先
  //  出勤日数が少ない(目標まで余裕がある)メンバーから優先して埋め、
  //  3人確保後は目標ペースに達していないメンバーだけ追加出勤
  const BUSY_MIN = 3;
  for (const d of [...busySet].sort((a, b) => a - b)) {
    const avail = MEMBERS.filter(m => work[m][d] === undefined);
    avail.sort((a, b) => workCount(a) - workCount(b)); // 出勤日数が少ない順
    let wToday = dayWorkers(d);
    for (const m of avail) {
      const cur  = workCount(m);
      const need = tgtDays(m) - cur;
      if (wToday < BUSY_MIN || need > 0) {
        work[m][d] = true;
        wToday++;
      } else {
        work[m][d] = false;
      }
    }
  }

  // Phase 2: 通常日 — 1日あたりMIN_STAFF〜MAX_STAFF人になるよう割り当て
  for (let d = 1; d <= dim; d++) {
    if (busySet.has(d)) continue;

    // 未決定メンバーを「赤字が多い順（出勤日数が少ない順）」に処理
    const unassigned = MEMBERS.filter(m => work[m][d] === undefined);
    unassigned.sort((a, b) => workCount(a) - workCount(b));

    let wToday = dayWorkers(d);

    for (let i = 0; i < unassigned.length; i++) {
      const m = unassigned[i];
      const remaining = unassigned.length - i; // 自分を含む残り未決定人数
      const cur = workCount(m);
      const left = dim - d + 1;
      const need = tgtDays(m) - cur;
      const s = streak(m, d);

      const maxReached = wToday >= MAX_STAFF;
      const mustRest   = s >= maxConsecutive || need <= 0;
      // 残りメンバー全員が出勤してもMIN_STAFFに届かない場合は出勤必須
      const minStaffForce = (wToday + remaining - 1) < MIN_STAFF;
      // 正田・尾谷ペア制約: 相手が休確定なら自分は出勤必須
      const PAIR = { "正田": "尾谷", "尾谷": "正田" };
      const pairForce = PAIR[m] && work[PAIR[m]][d] === false;
      const mustWork   = !mustRest && !maxReached && (minStaffForce || pairForce);

      if (maxReached || mustRest) {
        work[m][d] = false;
      } else if (mustWork) {
        work[m][d] = true;
        wToday++;
      } else {
        // ペース判定: 目標ペースより遅れていれば出勤(ceil で積極的に出勤)
        const expected = Math.ceil((tgtDays(m) / dim) * d);
        // 前日も休だった場合は連休を避けるため出勤を優先
        const prevWasOff = d > 1 && work[m][d - 1] === false;
        if (cur < expected || prevWasOff) {
          work[m][d] = true;
          wToday++;
        } else {
          // 自分が休んでも残りでMIN_STAFFを満たせるか確認
          const futureCanWork = remaining - 1;
          if (wToday + futureCanWork < MIN_STAFF) {
            work[m][d] = true; // 満たせないので出勤
            wToday++;
          } else {
            work[m][d] = false;
          }
        }
      }
    }
  }

  // Phase 3: 未割り当てを休に確定
  for (let d = 1; d <= dim; d++) {
    MEMBERS.forEach(m => { if (work[m][d] === undefined) work[m][d] = false; });
  }

  // Phase 4: MIN/MAX違反を後処理で修正
  for (let d = 1; d <= dim; d++) {
    let wCount = dayWorkers(d);

    // 出勤人数が少なすぎる場合: 休の人を出勤に変更
    if (wCount < MIN_STAFF) {
      const offMs = MEMBERS
        .filter(m => work[m][d] === false && !(reqOff[m] || []).includes(d))
        .sort((a, b) => workCount(a) - workCount(b)); // 出勤日数が少ない人優先
      for (const m of offMs) {
        if (wCount >= MIN_STAFF) break;
        work[m][d] = true;
        wCount++;
      }
    }

    // 出勤人数が多すぎる場合: 出勤の人を休に変更（繁忙日は除く）
    if (wCount > MAX_STAFF && !busySet.has(d)) {
      const workMs = MEMBERS
        .filter(m => work[m][d] === true)
        .sort((a, b) => {
          // 前日出勤だった人を優先して休に(その人を休にしても連休にならない)
          const aYest = d > 1 && work[a][d - 1] === true ? 1 : 0;
          const bYest = d > 1 && work[b][d - 1] === true ? 1 : 0;
          if (aYest !== bYest) return bYest - aYest;
          return workCount(b) - workCount(a); // 出勤日数が多い人から
        });
      for (const m of workMs) {
        if (wCount <= MAX_STAFF) break;
        // 正田・尾谷ペア: 相手が休なら自分は休にできない
        const PAIR = { "正田": "尾谷", "尾谷": "正田" };
        if (PAIR[m] && work[PAIR[m]][d] !== true) continue;
        work[m][d] = false;
        wCount--;
      }
    }

    // ペア制約の後処理: 正田・尾谷がどちらも休になっていたら出勤日数が少ない方を出勤に変更
    if (work["正田"][d] !== true && work["尾谷"][d] !== true) {
      const fix = workCount("正田") <= workCount("尾谷") ? "正田" : "尾谷";
      if (!(reqOff[fix] || []).includes(d)) {
        work[fix][d] = true;
        wCount++;
      }
    }
  }

  // Phase 4.5: 研修メンバーが2人体制にならないよう3人目を追加
  for (let d = 1; d <= dim; d++) {
    const hasTrainee = MEMBERS.some(m => training[m] && work[m][d] === true);
    if (!hasTrainee) continue;
    let cnt = dayWorkers(d);
    if (cnt >= 3) continue;
    // 研修でない・希望休でない・まだ休のメンバーを出勤日数が少ない順に追加
    const offMs = MEMBERS
      .filter(m => !training[m] && work[m][d] === false && !(reqOff[m] || []).includes(d))
      .sort((a, b) => workCount(a) - workCount(b));
    for (const m of offMs) {
      if (cnt >= 3) break;
      work[m][d] = true;
      cnt++;
    }
  }

  // Phase 5: 番種(早/中/遅)を割り当て
  //  ・各日で必ず早番を1人入れる
  //  ・同日に同じ番種が重複しない
  //  ・2人体制の日は早番+遅番の組み合わせ固定
  //  ・連続出勤中は同じ番種を継続（休日を挟むとリセット）
  const res = {};
  const customTimes = {}; // { [m]: { [d]: { start, end } } }
  MEMBERS.forEach(m => { res[m] = {}; });

  // 直前の出勤日の番種を返す（前日が休ならnull）
  const prevWorkType = (m, d) => (d > 1 && work[m][d - 1] === true) ? res[m][d - 1] : null;

  for (let d = 1; d <= dim; d++) {
    const workers = MEMBERS.filter(m => work[m][d] === true);
    const usedTypes = [];

    // 早番担当の決定: deficit順にソートしつつ、前日も早番継続中の人を優先
    const sortedByEarlyDeficit = [...workers].sort((a, b) => typeDeficit(b, "早") - typeDeficit(a, "早"));
    const earlyEligible = sortedByEarlyDeficit.filter(m => !isBlocked(m, "早"));
    const pool = earlyEligible.length > 0 ? earlyEligible : sortedByEarlyDeficit;
    const earlyConts  = pool.filter(m => prevWorkType(m, d) === "早");
    const earlyWorker = earlyConts.length > 0 ? earlyConts[0] : pool[0];
    const restWorkers = sortedByEarlyDeficit.filter(m => m !== earlyWorker);

    if (earlyWorker) {
      res[earlyWorker][d] = "早";
      typeCnt[earlyWorker]["早"]++;
      usedTypes.push("早");
    }

    const isTwoPerson = workers.length === 2;

    // 残りのメンバー: 連続出勤なら前日と同じ番種を継続、それ以外はbestType
    // 2人体制の日は遅番固定(例外なし)
    for (const m of restWorkers) {
      let t;
      if (isTwoPerson) {
        t = "遅";
      } else {
        const prev = prevWorkType(m, d);
        t = (prev && !usedTypes.includes(prev) && !isBlocked(m, prev))
          ? prev
          : bestType(m, usedTypes);
      }
      res[m][d] = t;
      typeCnt[m][t]++;
      usedTypes.push(t);
    }

    // 2人体制の日: 特別時刻をcustomTimesに記録
    if (isTwoPerson) {
      workers.forEach(m => {
        const type = res[m][d];
        if (TWO_TIMES[type]) {
          if (!customTimes[m]) customTimes[m] = {};
          customTimes[m][d] = { ...TWO_TIMES[type] };
        }
      });
    }

    MEMBERS.filter(m => work[m][d] !== true).forEach(m => { res[m][d] = "休"; });
  }

  return { assignments: res, customTimes };
}

// 週休2日ベースで月の目標時間を計算(平日数 × 8h)
function calcMonthlyTargetHours(year, month) {
  const dim = new Date(year, month, 0).getDate();
  let weekdays = 0;
  for (let d = 1; d <= dim; d++) {
    const dow = new Date(year, month - 1, d).getDay();
    if (dow !== 0 && dow !== 6) weekdays++;
  }
  return weekdays * 8;
}

// 番種ごとのデフォルト時刻(分換算)
const DRAFT_TIMES = {
  "早": { start: 9*60+30,  end: 18*60+30 },
  "中": { start: 10*60+30, end: 19*60+30 },
  "遅": { start: 11*60+30, end: 20*60+30 },
};
// 2人体制時の特別時刻
const TWO_TIMES = { "早": { start: 9*60+30, end: 19*60 }, "遅": { start: 11*60, end: 20*60+30 } };
const minsToTime = m => `${String(Math.floor(m/60)).padStart(2,'0')}:${m%60===0?'00':'30'}`;
const timeToMins = t => { const [h,mm] = t.split(':').map(Number); return h*60+mm; };

function DraftView({ year, month }) {
  const daysInMonth = new Date(year, month, 0).getDate();
  const sk = `draft:${year}-${String(month).padStart(2, "0")}`;

  const [draft, setDraft] = useState(() => {
    try { const r = storage.get(sk); return r ? JSON.parse(r) : { assignments: {}, busyDays: [], requestedOff: {} }; }
    catch { return { assignments: {}, busyDays: [], requestedOff: {} }; }
  });
  const [mode, setMode]       = useState("assign"); // "assign" | "request" | "ratio"
  const [targetH, setTargetH] = useState(() => calcMonthlyTargetHours(year, month));
  const [maxCons, setMaxCons] = useState(5);
  const defaultTargetH = calcMonthlyTargetHours(year, month);
  const [autoFlash, setAutoFlash] = useState(false);
  const [editCell, setEditCell] = useState(null); // { m, day, startMins, endMins }
  const cellLastTap = React.useRef({ m: null, day: null, t: 0 });
  const [activeCell, setActiveCell] = React.useState(null); // { m, day }
  const activeCellTimer = React.useRef(null);
  const histRef = React.useRef({ past: [], future: [] });
  const [canUndo, setCanUndo] = React.useState(false);
  const [canRedo, setCanRedo] = React.useState(false);

  const DK = {
    bg: "#1a1a1a", bg2: "#242424", bg3: "#2a2a2a",
    border: "#383838", border2: "#2e2e2e",
    text: "#e8e8e8", text2: "#888", text3: "#555",
  };
  const SHIFT_DK = {
    "早":  { bg: "#2a2416", text: "#c9a84c" },
    "中":  { bg: "#162033", text: "#5b8fc9" },
    "遅":  { bg: "#162219", text: "#3d9467" },
    "遅2": { bg: "#0f2420", text: "#2d9480" }, // 2人体制(11:00)
    "休":  { bg: "#252525", text: "#666" },
  };

  function save(next) {
    const h = histRef.current;
    h.past.push(JSON.parse(JSON.stringify(draft)));
    if (h.past.length > 30) h.past.shift();
    h.future = [];
    setCanUndo(true);
    setCanRedo(false);
    setDraft(next);
    try { storage.set(sk, JSON.stringify(next)); } catch {}
  }

  function undo() {
    const h = histRef.current;
    if (!h.past.length) return;
    const prev = h.past.pop();
    h.future.push(JSON.parse(JSON.stringify(draft)));
    setCanUndo(h.past.length > 0);
    setCanRedo(true);
    setDraft(prev);
    try { storage.set(sk, JSON.stringify(prev)); } catch {}
  }

  function redo() {
    const h = histRef.current;
    if (!h.future.length) return;
    const next = h.future.pop();
    h.past.push(JSON.parse(JSON.stringify(draft)));
    setCanUndo(true);
    setCanRedo(h.future.length > 0);
    setDraft(next);
    try { storage.set(sk, JSON.stringify(next)); } catch {}
  }

  function handleAuto() {
    const { assignments: newAssign, customTimes: newCustomTimes } = buildAutoSchedule(
      year, month, draft.requestedOff, draft.busyDays, targetH, maxCons, draft.ratios || {}, draft.training || {}, draft.memberDays || {}
    );
    // Merge auto-generated customTimes with existing ones (auto only writes 2-person days)
    const mergedCustom = { ...(draft.customTimes || {}) };
    Object.entries(newCustomTimes).forEach(([m, days]) => {
      mergedCustom[m] = { ...(mergedCustom[m] || {}), ...days };
    });
    save({ ...draft, assignments: newAssign, customTimes: mergedCustom });
    setMode("assign");
    setAutoFlash(true);
    setTimeout(() => setAutoFlash(false), 1200);
  }

  function handleClear() {
    save({ ...draft, assignments: {} });
  }

  function cycleShift(m, day) {
    const cur  = draft.assignments[m]?.[day] ?? null;
    const next = DRAFT_TYPES[(DRAFT_TYPES.indexOf(cur) + 1) % DRAFT_TYPES.length];
    const newAssign = { ...draft.assignments, [m]: { ...(draft.assignments[m] || {}), [day]: next } };
    // 2人体制チェック: 出勤メンバー数に応じてcustomTimesを更新
    const workers = MEMBERS.filter(mm => { const s = newAssign[mm]?.[day]; return s && s !== "休"; });
    const ct = JSON.parse(JSON.stringify(draft.customTimes || {}));
    if (workers.length === 2) {
      workers.forEach(mm => {
        const type = newAssign[mm][day];
        if (!ct[mm]) ct[mm] = {};
        if (TWO_TIMES[type]) ct[mm][day] = { ...TWO_TIMES[type] };
        else delete ct[mm][day];
      });
    } else {
      // 2人体制でなくなった場合、TWO_TIMESと一致するcustomTimeを削除
      MEMBERS.forEach(mm => {
        const entry = ct[mm]?.[day];
        if (!entry) return;
        const isTwoTime = Object.values(TWO_TIMES).some(t => t.start === entry.start && t.end === entry.end);
        if (isTwoTime) { ct[mm] = { ...ct[mm] }; delete ct[mm][day]; }
      });
    }
    save({ ...draft, assignments: newAssign, customTimes: ct });
  }

  function toggleReqOff(member, day) {
    const cur  = draft.requestedOff[member] || [];
    const next = cur.includes(day) ? cur.filter(d => d !== day) : [...cur, day];
    save({ ...draft, requestedOff: { ...draft.requestedOff, [member]: next } });
  }

  function toggleBusy(day) {
    const cur = draft.busyDays || [];
    save({ ...draft, busyDays: cur.includes(day) ? cur.filter(d => d !== day) : [...cur, day] });
  }

  const globalTgtDays = Math.round(targetH / DRAFT_H_PER_DAY);
  const memberStats = MEMBERS.map(m => {
    const asgn = draft.assignments[m] || {};
    const workDays = Array.from({ length: daysInMonth }, (_, i) => i + 1)
      .filter(d => asgn[d] && asgn[d] !== "休").length;
    const memberTgtDays = draft.memberDays?.[m] ?? globalTgtDays;
    return { m, workDays, totalH: workDays * DRAFT_H_PER_DAY, tgtH: memberTgtDays * DRAFT_H_PER_DAY };
  });

  const dayStaff = Array.from({ length: daysInMonth }, (_, i) => {
    const d = i + 1;
    return MEMBERS.filter(m => { const s = draft.assignments[m]?.[d]; return s && s !== "休"; }).length;
  });

  const alerts = [];
  memberStats.forEach(({ m, totalH, tgtH }) => {
    if (totalH > DRAFT_MAX_H)
      alerts.push({ t: "w", msg: `${m}: ${totalH}h — 上限(${DRAFT_MAX_H}h)超え` });
    else if (totalH < tgtH)
      alerts.push({ t: "i", msg: `${m}: ${totalH}h — 目標まで${tgtH - totalH}h不足` });
  });

  // 過労メンバーのセット(これ以上出勤させると上限超え)
  const overloadSet = new Set(memberStats.filter(({ totalH }) => totalH >= DRAFT_MAX_H).map(({ m }) => m));

  for (let d = 1; d <= daysInMonth; d++) {
    if ((draft.busyDays || []).includes(d) && dayStaff[d - 1] < 3)
      alerts.push({ t: "w", day: d, msg: `${month}/${d}: 繁忙日 出勤${dayStaff[d - 1]}人(3人必要)` });
    const hasEarly = MEMBERS.some(m => draft.assignments[m]?.[d] === "早");
    const hasLate  = MEMBERS.some(m => draft.assignments[m]?.[d] === "遅");
    const hasAnyWorker = dayStaff[d - 1] > 0;
    if (hasAnyWorker && !hasEarly)
      alerts.push({ t: "w", day: d, msg: `${month}/${d}: 早番なし` });
    if (hasAnyWorker && !hasLate)
      alerts.push({ t: "w", day: d, msg: `${month}/${d}: 遅番なし` });

    // ヘルプ要請チェック: 希望休 + 時間超えを加味して出勤可能人数を算出
    const reqOffToday  = MEMBERS.filter(m => (draft.requestedOff[m] || []).includes(d));
    const constrainedSet = new Set([...reqOffToday, ...overloadSet]);
    const canWork = MEMBERS.filter(m => !constrainedSet.has(m));
    const minNeeded = (draft.busyDays || []).includes(d) ? 3 : 2;
    if (canWork.length < minNeeded) {
      const reasons = [];
      if (reqOffToday.length) reasons.push(`希望休: ${reqOffToday.join("・")}`);
      const overToday = [...overloadSet].filter(m => !reqOffToday.includes(m)); // 重複表示を避ける
      if (overToday.length) reasons.push(`時間超え: ${overToday.join("・")}`);
      alerts.push({ t: "h", day: d, msg: `${month}/${d}: ヘルプ要請推奨 (${reasons.join(" / ")})` });
    }
  }

  // 日付ごとのアラート種別マップ
  const alertDayMap = {};
  alerts.forEach(a => {
    if (a.day) {
      if (!alertDayMap[a.day]) alertDayMap[a.day] = [];
      alertDayMap[a.day].push(a.t);
    }
  });

  const rangeRow = (label, val, set, min, max, step, display, extra) => (
    <div style={{ marginBottom: 10 }}>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 3 }}>
        <span style={{ fontSize: 9, color: DK.text2, letterSpacing: 1 }}>{label}</span>
        <span style={{ fontSize: 11, color: DK.text }}>{display(val)}{extra}</span>
      </div>
      <input type="range" value={val} min={min} max={max} step={step}
        onChange={e => set(Number(e.target.value))}
        style={{ width: "100%", accentColor: DK.text, height: 20 }} />
    </div>
  );

  return (
    <div style={{ background: DK.bg }}>
      {/* ── Auto controls ── */}
      <div style={{ padding: "10px 14px", borderBottom: `1px solid ${DK.border}`, background: DK.bg2 }}>
        {/* Settings row */}
        {rangeRow("目標時間", targetH, setTargetH, 140, 220, 1, v => `${v}h`,
          targetH !== defaultTargetH
            ? <button onClick={() => setTargetH(defaultTargetH)} style={{
                background: "none", border: "none", padding: "0 0 0 8px",
                fontSize: 9, color: DK.text3, cursor: "pointer", textDecoration: "underline"
              }}>週休2日({defaultTargetH}h)</button>
            : <span style={{ fontSize: 9, color: DK.text3, marginLeft: 6 }}>
                ({defaultTargetH/8}日×8h)
              </span>
        )}
        {rangeRow("連続出勤上限", maxCons, setMaxCons, 3, 7, 1, v => `${v}日`, "")}
        {/* Action buttons */}
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={handleAuto} style={{
            flex: 2, padding: "10px 0",
            background: autoFlash ? "#2d6a4f" : "#e8e8e8", color: "#111",
            border: "none", cursor: "pointer",
            fontSize: 10, letterSpacing: 3, textTransform: "uppercase",
            transition: "background 0.3s"
          }}>
            {autoFlash ? "Done!" : "Auto"}
          </button>
          <button onClick={handleClear} style={{
            flex: 1, padding: "10px 0",
            background: "none", color: DK.text2,
            border: `1px solid ${DK.border}`, cursor: "pointer",
            fontSize: 10, letterSpacing: 2, textTransform: "uppercase"
          }}>Clear</button>
        </div>
        {/* Undo / Redo */}
        <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
          {[["← Undo", undo, canUndo], ["Redo →", redo, canRedo]].map(([label, fn, enabled]) => (
            <button key={label} onClick={fn} disabled={!enabled} style={{
              flex: 1, padding: "8px 0", background: "none", cursor: enabled ? "pointer" : "default",
              border: `1px solid ${enabled ? DK.border : DK.border2}`,
              fontSize: 9, letterSpacing: 2, textTransform: "uppercase",
              color: enabled ? DK.text2 : DK.text3, transition: "all 0.15s"
            }}>{label}</button>
          ))}
        </div>
      </div>

      {/* mode toggle */}
      <div style={{ display: "flex", borderBottom: `1px solid ${DK.border}`, position: "sticky", top: 0, zIndex: 10, background: DK.bg }}>
        {[["assign", "シフト組み"], ["request", "希望休設定"], ["ratio", "比率設定"]].map(([id, lbl]) => (
          <button key={id} onClick={() => setMode(id)} style={{
            flex: 1, padding: "9px 0", background: "none", border: "none", cursor: "pointer",
            fontSize: 9, letterSpacing: 2,
            color: mode === id ? DK.text : DK.text3,
            borderBottom: mode === id ? `1.5px solid ${DK.text}` : "1.5px solid transparent",
            transition: "all 0.2s"
          }}>{lbl}</button>
        ))}
      </div>

      {/* member stats */}
      <div style={{ display: "grid", gridTemplateColumns: `repeat(${MEMBERS.length}, 1fr)`, borderBottom: `1px solid ${DK.border}`, background: DK.bg2 }}>
        {memberStats.map(({ m, workDays, totalH, tgtH }) => {
          const color = totalH > DRAFT_MAX_H ? "#c0392b" : totalH < tgtH ? DK.text3 : "#2d6a4f";
          return (
            <div key={m} style={{ padding: "8px 4px", textAlign: "center", borderRight: `1px solid ${DK.border}` }}>
              <div style={{ fontSize: 9, letterSpacing: 1, color: DK.text2, marginBottom: 1 }}>{m}</div>
              <div style={{ fontSize: 12, fontWeight: 400, color }}>{totalH}h</div>
              <div style={{ fontSize: 8, color: DK.text3 }}>{workDays}日</div>
            </div>
          );
        })}
      </div>

      {/* alerts */}
      {alerts.length > 0 && (
        <div style={{ padding: "8px 12px", borderBottom: `1px solid ${DK.border2}`, background: "#1e1c14" }}>
          {alerts.map((a, i) => (
            <div key={i} style={{
              fontSize: 10, lineHeight: 1.9,
              color: a.t === "w" ? "#c0392b" : a.t === "h" ? "#7b3fa0" : "#999"
            }}>
              {a.t === "w" ? "⚠ " : a.t === "h" ? "！ " : "· "}{a.msg}
            </div>
          ))}
        </div>
      )}

      {/* ── 比率設定パネル ── */}
      {mode === "ratio" && (
        <div style={{ padding: "16px 14px 8px", borderBottom: `1px solid ${DK.border}` }}>
          {MEMBERS.map(m => {
            const getRatio = t => draft.ratios?.[m]?.[t] ?? 3;
            const setRatio = (t, lv) => {
              save({ ...draft, ratios: { ...draft.ratios, [m]: { ...(draft.ratios?.[m] || {}), [t]: lv } } });
            };
            return (
              <div key={m} style={{ marginBottom: 18 }}>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
                  <span style={{ fontSize: 11, fontWeight: 500, color: DK.text, letterSpacing: 1 }}>{m}</span>
                  <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                    {/* 目標日数調整 */}
                    {(() => {
                      const cur = draft.memberDays?.[m] ?? globalTgtDays;
                      const isCustom = draft.memberDays?.[m] != null;
                      const setDays = d => save({ ...draft, memberDays: { ...(draft.memberDays || {}), [m]: d } });
                      const resetDays = () => { const md = { ...(draft.memberDays || {}) }; delete md[m]; save({ ...draft, memberDays: md }); };
                      return (
                        <div style={{ display: "flex", alignItems: "center", gap: 3 }}>
                          <button onClick={() => setDays(Math.max(1, cur - 1))} style={{ width: 20, height: 20, border: `1px solid ${DK.border}`, background: "none", color: DK.text2, cursor: "pointer", fontSize: 12, lineHeight: 1, padding: 0 }}>−</button>
                          <span onClick={isCustom ? resetDays : undefined} style={{ fontSize: 10, color: isCustom ? "#c9a84c" : DK.text3, minWidth: 30, textAlign: "center", cursor: isCustom ? "pointer" : "default" }}>{cur}日</span>
                          <button onClick={() => setDays(Math.min(daysInMonth, cur + 1))} style={{ width: 20, height: 20, border: `1px solid ${DK.border}`, background: "none", color: DK.text2, cursor: "pointer", fontSize: 12, lineHeight: 1, padding: 0 }}>＋</button>
                        </div>
                      );
                    })()}
                    {/* 研修トグル */}
                    <button onClick={() => save({ ...draft, training: { ...(draft.training || {}), [m]: !(draft.training?.[m]) } })} style={{
                      padding: "2px 9px", fontSize: 9, letterSpacing: 1, cursor: "pointer",
                      background: draft.training?.[m] ? "#2a1a38" : "none",
                      color: draft.training?.[m] ? "#b07fd4" : DK.text3,
                      border: `1px solid ${draft.training?.[m] ? "#7b3fa0" : DK.border}`,
                    }}>研修</button>
                  </div>
                </div>
                {["早", "中", "遅"].map(t => {
                  const col = DRAFT_COLORS[t];
                  const val = getRatio(t);
                  const LEVELS = [0, 1, 2, 3, 4, 5];
                  const labels = ["なし", "最少", "少", "普通", "多", "最多"];
                  return (
                    <div key={t} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 7 }}>
                      <span style={{ fontSize: 10, fontWeight: 500, color: col.text, width: 18 }}>{t}</span>
                      <div style={{ display: "flex", gap: 2, flex: 1 }}>
                        {LEVELS.map(lv => (
                          <button key={lv} onClick={() => setRatio(t, lv)} style={{
                            flex: 1, height: 22, border: "none", cursor: "pointer",
                            background: lv === 0
                              ? (val === 0 ? "#3a3a3a" : "#2a2a2a")
                              : (lv <= val ? SHIFT_DK[t].bg : "#2a2a2a"),
                            borderTop: `2px solid ${lv === 0 ? (val === 0 ? "#777" : "#444") : (lv <= val ? col.text : "#444")}`,
                            borderBottom: `2px solid ${lv === 0 ? (val === 0 ? "#777" : "#444") : (lv <= val ? col.text : "#444")}`,
                            borderLeft: lv === 0 ? `2px solid ${val === 0 ? "#777" : "#444"}` : "1px solid transparent",
                            borderRight: lv === 5 ? `2px solid ${lv <= val ? col.text : "#444"}` : "1px solid transparent",
                            transition: "all 0.1s",
                            fontSize: lv === 0 ? 9 : undefined,
                            color: lv === 0 ? (val === 0 ? "#aaa" : "#555") : undefined,
                          }}>{lv === 0 ? "×" : ""}</button>
                        ))}
                      </div>
                      <span style={{ fontSize: 9, color: val === 0 ? "#c0392b" : DK.text2, width: 28, textAlign: "right" }}>{labels[val]}</span>
                    </div>
                  );
                })}
              </div>
            );
          })}
          <div style={{ fontSize: 9, color: DK.text3, lineHeight: 1.8, marginTop: 4 }}>
            比率はAutoボタン実行時に番種の割り当てへ反映されます
          </div>
        </div>
      )}

      {/* grid header */}
      <div style={{
        display: "grid", gridTemplateColumns: `40px repeat(${MEMBERS.length}, 1fr) 28px`,
        borderBottom: `1px solid ${DK.border}`, background: DK.bg2,
        position: "sticky", top: 37, zIndex: 9
      }}>
        <div />
        {MEMBERS.map(m => (
          <div key={m} style={{ padding: "5px 2px", fontSize: 9, color: DK.text2, textAlign: "center", borderLeft: `1px solid ${DK.border}` }}>{m}</div>
        ))}
        <div style={{ padding: "5px 2px", fontSize: 7, color: DK.text3, textAlign: "center", borderLeft: `1px solid ${DK.border}` }}>繁忙</div>
      </div>

      {/* grid rows */}
      {Array.from({ length: daysInMonth }, (_, i) => i + 1).map(day => {
        const dow = new Date(year, month - 1, day).getDay();
        const isBusy = (draft.busyDays || []).includes(day);
        const cnt = dayStaff[day - 1];
        const isSun = dow === 0, isSat = dow === 6;
        return (
          <div key={day} style={{
            display: "grid", gridTemplateColumns: `40px repeat(${MEMBERS.length}, 1fr) 28px`,
            borderBottom: `1px solid ${DK.border2}`,
            background: isBusy && cnt < 3 ? "#2a1010" : isBusy ? "#252015" : DK.bg
          }}>
            <div style={{ padding: "6px 4px", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
              <span style={{ fontSize: 13, fontWeight: 300, color: isSun ? "#c0392b" : isSat ? "#888" : DK.text }}>{day}</span>
              <span style={{ fontSize: 8, letterSpacing: 1, color: isSun ? "#c0392b" : DK.text3 }}>{WEEKDAY_JP[dow]}</span>
              {isBusy && <span style={{ fontSize: 7, color: cnt >= 3 ? "#2d6a4f" : "#c0392b" }}>{cnt}人</span>}
              {alertDayMap[day] && (
                <span style={{ fontSize: 8, color: alertDayMap[day].includes("w") ? "#c0392b" : "#7b3fa0", lineHeight: 1, marginTop: 1 }}>
                  {alertDayMap[day].includes("w") ? "⚠" : "！"}
                </span>
              )}
            </div>

            {MEMBERS.map(m => {
              if (mode === "request") {
                const isReq = (draft.requestedOff[m] || []).includes(day);
                return (
                  <button key={m} onClick={() => toggleReqOff(m, day)} style={{
                    border: "none", borderLeft: `1px solid ${DK.border2}`, minHeight: 44,
                    background: isReq ? "#2a1010" : DK.bg, cursor: "pointer",
                    display: "flex", alignItems: "center", justifyContent: "center"
                  }}>
                    <span style={{ fontSize: isReq ? 9 : 10, color: isReq ? "#c0392b" : DK.text3, letterSpacing: isReq ? 1 : 0 }}>
                      {isReq ? "希望" : "—"}
                    </span>
                  </button>
                );
              }
              const st    = draft.assignments[m]?.[day] ?? null;
              const isReq = (draft.requestedOff[m] || []).includes(day);
              // カスタム時刻 or デフォルト
              const custom = draft.customTimes?.[m]?.[day];
              const defT   = DRAFT_TIMES[st];
              const startM = custom?.start ?? defT?.start;
              const endM   = custom?.end   ?? defT?.end;
              const col    = st ? (st === "遅" && startM === TWO_TIMES["遅"].start ? SHIFT_DK["遅2"] : SHIFT_DK[st]) : null;
              const timeStr = startM != null ? `${minsToTime(startM)}-${minsToTime(endM)}` : "";
              const isEditing = editCell?.m === m && editCell?.day === day;
              const isActive = activeCell?.m === m && activeCell?.day === day;
              return (
                <button key={m} onClick={() => {
                  // アクティブ表示: タップしたセルを太線でハイライト(600ms)
                  setActiveCell({ m, day });
                  if (activeCellTimer.current) clearTimeout(activeCellTimer.current);
                  activeCellTimer.current = setTimeout(() => setActiveCell(null), 3000);
                  if (!st || st === "休") { cycleShift(m, day); return; }
                  if (isEditing) { setEditCell(null); return; }
                  if (editCell?.m === m && editCell?.day !== day) { cycleShift(m, day); setEditCell(null); return; }
                  // ref ベースのダブルタップ: 同じセルを400ms以内に2回タップで時刻編集
                  const now = Date.now();
                  const last = cellLastTap.current;
                  if (last.m === m && last.day === day && now - last.t < 400) {
                    cellLastTap.current = { m: null, day: null, t: 0 };
                    setEditCell({ m, day, startMins: startM ?? defT?.start ?? 9*60+30, endMins: endM ?? defT?.end ?? 18*60+30 });
                  } else {
                    cellLastTap.current = { m, day, t: now };
                    cycleShift(m, day);
                  }
                }} style={{
                  border: isActive ? `2px solid #e8e8e8` : "none",
                  borderLeft: isActive ? `2px solid #e8e8e8` : `1px solid ${DK.border2}`,
                  minHeight: 44, zIndex: isActive ? 1 : 0,
                  background: isEditing ? "#162033" : st ? col.bg : isReq ? "#2a1010" : DK.bg,
                  cursor: "pointer", display: "flex", flexDirection: "column",
                  alignItems: "center", justifyContent: "center", gap: 1, padding: "4px 2px",
                  boxSizing: "border-box", position: "relative",
                }}>
                  {st
                    ? <>
                        <span style={{ fontSize: 11, fontWeight: 500, color: col.text, lineHeight: 1 }}>{st}</span>
                        {timeStr && <span style={{ fontSize: 7, color: col.text, opacity: custom ? 1 : 0.7, letterSpacing: 0, lineHeight: 1 }}>{timeStr}</span>}
                      </>
                    : <span style={{ fontSize: isReq ? 8 : 10, color: isReq ? "#e8a0a0" : DK.text3 }}>{isReq ? "希" : "—"}</span>
                  }
                </button>
              );
            })}

            <button onClick={() => toggleBusy(day)} style={{
              border: "none", borderLeft: `1px solid ${DK.border2}`, minHeight: 44,
              background: isBusy ? "#252015" : DK.bg, cursor: "pointer",
              display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14
            }}>
              {isBusy ? "★" : "☆"}
            </button>
          </div>
        );
      })}

      <div style={{ padding: "14px 16px 32px", fontSize: 10, color: DK.text3, lineHeight: 1.9, whiteSpace: "pre-line" }}>
        {mode === "assign"
          ? "Autoで自動仮組み → 手動で微調整\nタップ: — → 早 → 中 → 遅 → 休 → —\n★ で繁忙日を設定(3人体制)\nダブルタップで出退勤時間を編集"
          : "タップして希望休を設定\n設定後にシフト組みタブでAutoを実行"}
      </div>

      {/* 時刻編集ボトムシート */}
      {editCell && (() => {
        const { m: em, day: ed, startMins, endMins } = editCell;
        const dow = new Date(year, month - 1, ed).getDay();
        const dowStr = ["日","月","火","水","木","金","土"][dow];
        return (
          <div onClick={() => setEditCell(null)} style={{
            position: "fixed", inset: 0, background: "rgba(0,0,0,0.45)", zIndex: 200,
            display: "flex", alignItems: "flex-end"
          }}>
            <div onClick={e => e.stopPropagation()} style={{
              width: "100%", background: DK.bg, borderRadius: "16px 16px 0 0",
              padding: "20px 20px 36px", boxSizing: "border-box"
            }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
                <div>
                  <span style={{ fontSize: 13, fontWeight: 600, color: DK.text }}>{em}</span>
                  <span style={{ fontSize: 11, color: DK.text2, marginLeft: 8 }}>{month}/{ed}({dowStr})</span>
                </div>
                <button onClick={() => setEditCell(null)} style={{
                  background: "none", border: "none", fontSize: 18, color: DK.text2, cursor: "pointer", padding: 4
                }}>✕</button>
              </div>

              {rangeRow("出勤時刻", startMins,
                v => setEditCell(prev => ({ ...prev, startMins: v, endMins: Math.max(prev.endMins, v + 60) })),
                7*60, 14*60, 30,
                v => minsToTime(v), " 出勤"
              )}
              {rangeRow("退勤時刻", endMins,
                v => setEditCell(prev => ({ ...prev, endMins: v })),
                startMins + 60, 23*60+30, 30,
                v => minsToTime(v), " 退勤"
              )}

              <div style={{ fontSize: 10, color: DK.text2, textAlign: "center", marginBottom: 14 }}>
                実働 {Math.floor((endMins - startMins) / 60)}h{(endMins - startMins) % 60 ? "30" : "00"}m
              </div>

              <button onClick={() => {
                const ct = draft.customTimes || {};
                save({
                  ...draft,
                  customTimes: {
                    ...ct,
                    [em]: { ...(ct[em] || {}), [ed]: { start: startMins, end: endMins } }
                  }
                });
                setEditCell(null);
              }} style={{
                width: "100%", padding: "12px 0", background: "#e8e8e8", color: "#111",
                border: "none", borderRadius: 8, fontSize: 14, fontWeight: 600, cursor: "pointer"
              }}>保存</button>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

// ── Mount ────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ShiftManager />);
</script>

</body>
</html>
